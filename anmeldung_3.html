<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJEKT_1 – Anmeldung</title>
<style>
  :root {
    --bg: #0d0f14;
    --card: #161a22;
    --text: #f2f4f8;
    --muted: #9aa3b2;
    --accent: #6ee7d8;
    --accent-dark: #0d0f14;
    --error: #ff8080;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #1a2030, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 20px;
    padding: 36px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    text-align: center;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 6px;
    letter-spacing: 0.02em;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 28px;
    font-size: 0.95rem;
    line-height: 1.4;
  }
  label {
    display: block;
    text-align: left;
    font-size: 0.85rem;
    color: var(--muted);
    margin: 18px 0 6px;
  }
  input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid #2a3040;
    background: #0f1319;
    color: var(--text);
    font-size: 1rem;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    margin-top: 26px;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-dark);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .msg {
    margin-top: 18px;
    font-size: 0.9rem;
    min-height: 1.2em;
  }
  .msg.error { color: var(--error); }
  .msg.success { color: var(--accent); }
  .hint {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 4px;
    text-align: left;
  }
  .done-icon {
    font-size: 2.6rem;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

  <div class="card" id="card">
    <h1>PROJEKT_1</h1>
    <p class="sub">Trag dich kurz ein, damit wir wissen, wer kommt.</p>

    <form id="form">
      <label for="name">Dein Name</label>
      <input type="text" id="name" placeholder="Vorname" required autocomplete="given-name">

      <label for="begleitpersonen">Begleitpersonen <span style="opacity:.7">(optional)</span></label>
      <input type="number" id="begleitpersonen" min="0" step="1" placeholder="0" inputmode="numeric">
      <div class="hint">Wie viele Personen bringst du zusätzlich mit? Falls niemand mitkommt, einfach frei lassen.</div>

      <button type="submit" id="submitBtn">Anmelden</button>
      <div class="msg" id="msg"></div>
    </form>

    <div id="thankyou" style="display:none;">
      <div class="done-icon">🎉</div>
      <h1>Danke!</h1>
      <p class="sub">Deine Anmeldung ist eingegangen. Wir freuen uns auf dich!</p>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // --- Supabase-Verbindung ---
  const SUPABASE_URL = "https://kqcmvyanjddcmeooqxaz.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxY212eWFuamRkY21lb29xeGF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODA5MzksImV4cCI6MjEwNDQ1NjkzOX0.L9xyydjhnMPk62nCeGuxaU3TQ7mnWAXKQ4xVn6payPA";

  const form = document.getElementById("form");
  const msg = document.getElementById("msg");
  const submitBtn = document.getElementById("submitBtn");

  // WICHTIG: Der Klick auf "Anmelden" wird jetzt IMMER abgefangen,
  // auch wenn die Supabase-Bibliothek (von der CDN) nicht geladen hat.
  // Vorher konnte ein Ladefehler dazu führen, dass der Browser das
  // Formular klassisch neu lädt (kein "Danke", kein Eintrag in Supabase).
  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (typeof window.supabase === "undefined") {
      msg.textContent = "Verbindung konnte nicht aufgebaut werden. Bitte Seite neu laden (evtl. Internet/WLAN prüfen) und nochmal versuchen.";
      msg.className = "msg error";
      return;
    }

    const name = document.getElementById("name").value.trim();
    const begleitRaw = document.getElementById("begleitpersonen").value.trim();
    const begleitpersonen = begleitRaw === "" ? 0 : parseInt(begleitRaw, 10);

    if (!name) {
      msg.textContent = "Bitte gib deinen Namen ein.";
      msg.className = "msg error";
      return;
    }
    if (isNaN(begleitpersonen) || begleitpersonen < 0) {
      msg.textContent = "Bitte eine gültige Zahl bei Begleitpersonen eingeben.";
      msg.className = "msg error";
      return;
    }

    submitBtn.disabled = true;
    msg.textContent = "Wird gesendet …";
    msg.className = "msg";

    try {
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { error } = await supabase
        .from("Anmeldungen")
        .insert([{ Name: name, Begleitpersonen: begleitpersonen }]);

      if (error) {
        console.error(error);
        msg.textContent = "Da ist etwas schiefgelaufen. Bitte versuch es noch einmal.";
        msg.className = "msg error";
        submitBtn.disabled = false;
        return;
      }

      document.getElementById("form").style.display = "none";
      document.getElementById("thankyou").style.display = "block";
    } catch (err) {
      console.error(err);
      msg.textContent = "Da ist etwas schiefgelaufen. Bitte versuch es noch einmal.";
      msg.className = "msg error";
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
