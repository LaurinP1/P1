<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mein P</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        .buehne {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .mitte {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .P {
            font-family: Arial, sans-serif;
            font-size: 300px;
            font-weight: bold;
            color: #d6d6d6;

            animation: drehenGross 8s linear infinite;
        }

        @keyframes drehenGross {
            from { transform: perspective(800px) rotateY(0deg); }
            to   { transform: perspective(800px) rotateY(360deg); }
        }

        .orbitPunkt {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
        }

        .orbitDreher {
            animation-name: orbitDrehung;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes orbitDrehung {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .kleinerBuchstabe {
            position: absolute;
            left: 0;
            top: 0;

            font-family: Arial, sans-serif;
            font-size: 70px;
            font-weight: bold;
            color: #d6d6d6;

            animation-name: drehenKlein;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes drehenKlein {
            from { transform: translate(-50%, -50%) perspective(500px) rotateY(0deg); }
            to   { transform: translate(-50%, -50%) perspective(500px) rotateY(360deg); }
        }
    </style>
</head>
