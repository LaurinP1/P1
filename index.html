<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mein P</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        #dreiDBereich {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #buchstabenSchicht {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #flugSchicht {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .orbitPunkt {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
        }

        .orbitDreher {
            animation-name: orbitDrehung;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes orbitDrehung {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .kleinerBuchstabe {
            position: absolute;
            left: 0;
            top: 0;

            font-family: Arial, sans-serif;
            font-size: 70px;
            font-weight: bold;

            color: transparent;
            background: linear-gradient(180deg, #ffffff 0%, #cfcfcf 35%, #6e6e6e 52%, #a8a8a8 65%, #ffffff 100%);
            background-clip: text;
            -webkit-background-clip: text;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.6));

            animation-name: drehenKlein;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes drehenKlein {
            from { transform: translate(-50%, -50%) perspective(500px) rotateY(0deg); }
            to   { transform: translate(-50%, -50%) perspective(500px) rotateY(360deg); }
        }

        .fliegenderBuchstabe {
            position: absolute;
            transform: translate(-50%, -50%);

            font-family: Arial, sans-serif;
            font-weight: bold;

            color: transparent;
            background: linear-gradient(180deg, #ffffff 0%, #cfcfcf 35%, #6e6e6e 52%, #a8a8a8 65%, #ffffff 100%);
            background-clip: text;
            -webkit-background-clip: text;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.7)) drop-shadow(0 0 40px rgba(255,255,255,0.6));
        }
    </style>
</head>

<body>

    <div id="dreiDBereich"></div>

    <div id="buchstabenSchicht"></div>

    <div id="flugSchicht"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">

        import * as THREE from "three";
        import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/loaders/GLTFLoader.js";
        import { RoomEnvironment } from "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/environments/RoomEnvironment.js";

        // ================== TEIL 1: DAS 3D-CHROME-P ==================

        var dreiDBereich = document.getElementById("dreiDBereich");

        var szene = new THREE.Scene();

        var kamera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        kamera.position.set(0, 0, 5);

        var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        dreiDBereich.appendChild(renderer.domElement);

        var pmrem = new THREE.PMREMGenerator(renderer);
        var umgebungsTextur = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
        szene.environment = umgebungsTextur;

        var licht1 = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
        szene.add(licht1);

        var licht2 = new THREE.DirectionalLight(0xffffff, 2);
        licht2.position.set(3, 5, 4);
        szene.add(licht2);

        var lader = new GLTFLoader();
        var modell = null;

        lader.load(
            "p-metallic.glb",
            function (gltf) {

                modell = gltf.scene;
                szene.add(modell);

                var box = new THREE.Box3().setFromObject(modell);
                var groesse = new THREE.Vector3();
                box.getSize(groesse);
                var mitte = new THREE.Vector3();
                box.getCenter(mitte);

                modell.position.sub(mitte);

                var maxSeite = Math.max(groesse.x, groesse.y, groesse.z);
                var skala = 1.9 / maxSeite;
                modell.scale.setScalar(skala);

                modell.traverse(function (kind) {
                    if (kind.isMesh) {
                        kind.material.roughness = 0.08;
                        kind.material.envMapIntensity = 2.2;
                    }
                });
            },
            undefined,
            function (fehler) {
                console.error("FEHLER beim Laden von p-metallic.glb:", fehler);
            }
        );

        window.addEventListener("resize", function () {
            kamera.aspect = window.innerWidth / window.innerHeight;
            kamera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animiereDreiD() {
            requestAnimationFrame(animiereDreiD);

            if (modell) {
                modell.rotation.y += 0.008;
            }

            renderer.render(szene, kamera);
        }

        animiereDreiD();

        // ================== TEIL 2: DIE BUCHSTABEN ==================

        var SUPABASE_URL = "https://kqcmvyanjddcmeooqxaz.supabase.co";
        var SUPABASE_KEY = "sb_publishable_PJWkENh6UaNXozYPPgHauA_86KQNb1z";

        var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        var schicht = document.getElementById("buchstabenSchicht");
        var flugSchicht = document.getElementById("flugSchicht");

        var positionen = {};       // id -> Kreisbahn-Daten (Radius, Winkel, Geschwindigkeit ...)
        var buchstabenText = {};   // id -> der eigentliche Buchstabe (Text)
        var angekommen = {};       // id -> true, sobald er im Kreis mitfliegt
        var flugAktiv = {};        // id -> true, waehrend der Einflug-Animation laeuft

        var ERSTER_RADIUS = 320;
        var RADIUS_SCHRITT = 150;
        var BOGENABSTAND = 110;

        function zufallsZahl(min, max) {
            return Math.random() * (max - min) + min;
        }

        function ringPosition(index) {

            var radius = ERSTER_RADIUS;
            var ringNummer = 0;
            var restIndex = index;

            while (true) {
                var umfang = 2 * Math.PI * radius;
                var platzAufRing = Math.max(6, Math.floor(umfang / BOGENABSTAND));

                if (restIndex < platzAufRing) {
                    var winkel = (360 / platzAufRing) * restIndex;
                    return {
                        radius: radius,
                        winkel: winkel,
                        ringNummer: ringNummer
                    };
                }

                restIndex -= platzAufRing;
                radius += RADIUS_SCHRITT;
                ringNummer += 1;
            }
        }

        function erzeugePositionFuer(index) {

            var ring = ringPosition(index);

            return {
                radius: ring.radius,
                winkel: ring.winkel,
                orbitDauer: zufallsZahl(20, 35),
                spinDauer: zufallsZahl(5, 10),
                richtung: (ring.ringNummer % 2 === 0) ? "normal" : "reverse"
            };
        }

        function erzeugeOrbitElement(text, daten) {

            var traeger = document.createElement("div");
            traeger.className = "orbitPunkt";
            traeger.style.transform = "rotate(" + daten.winkel + "deg)";

            var dreher = document.createElement("div");
            dreher.className = "orbitPunkt orbitDreher";
            dreher.style.animationDuration = daten.orbitDauer + "s";
            dreher.style.animationDirection = daten.richtung;

            var abstand = document.createElement("div");
            abstand.className = "orbitPunkt";
            abstand.style.transform = "translateX(" + daten.radius + "px)";

            var buchstabe = document.createElement("div");
            buchstabe.className = "kleinerBuchstabe";
            buchstabe.textContent = text;
            buchstabe.style.animationDuration = daten.spinDauer + "s";

            abstand.appendChild(buchstabe);
            dreher.appendChild(abstand);
            traeger.appendChild(dreher);

            return traeger;
        }

        function renderOrbit() {

            schicht.innerHTML = "";

            for (var id in angekommen) {
                if (angekommen[id]) {
                    var element = erzeugeOrbitElement(buchstabenText[id], positionen[id]);
                    schicht.appendChild(element);
                }
            }
        }

        // Buchstaben, die beim ersten Laden der Seite schon vorhanden sind:
        // direkt in den Kreis setzen, ohne die Gross-Einflug-Animation.
        function platziereOhneEinflug(liste) {

            for (var i = 0; i < liste.length; i++) {

                var eintrag = liste[i];
                var id = eintrag.id;

                buchstabenText[id] = eintrag.Buchstabe;

                if (!positionen[id]) {
                    var naechsterIndex = Object.keys(positionen).length;
                    positionen[id] = erzeugePositionFuer(naechsterIndex);
                }

                angekommen[id] = true;
            }

            renderOrbit();
        }

        // Ein neuer Buchstabe kommt live dazu: gross in der Mitte zeigen,
        // kurz stehen lassen, dann zur Zielposition im Kreis fliegen lassen.
        function starteEinflug(eintrag) {

            var id = eintrag.id;
            var text = eintrag.Buchstabe;

            if (positionen[id] || flugAktiv[id]) {
                return;
            }

            buchstabenText[id] = text;
            flugAktiv[id] = true;

            var naechsterIndex = Object.keys(positionen).length;
            positionen[id] = erzeugePositionFuer(naechsterIndex);
            var daten = positionen[id];

            var mitteX = window.innerWidth / 2;
            var mitteY = window.innerHeight / 2;

            var winkelRad = daten.winkel * Math.PI / 180;
            var zielX = mitteX + daten.radius * Math.cos(winkelRad);
            var zielY = mitteY + daten.radius * Math.sin(winkelRad);

            var flugBuchstabe = document.createElement("div");
            flugBuchstabe.className = "fliegenderBuchstabe";
            flugBuchstabe.textContent = text;

            flugBuchstabe.style.left = mitteX + "px";
            flugBuchstabe.style.top = mitteY + "px";
            flugBuchstabe.style.fontSize = "0px";

            flugSchicht.appendChild(flugBuchstabe);

            // Schritt 1: gross einblenden in der Mitte
            requestAnimationFrame(function () {
                flugBuchstabe.style.transition = "font-size 0.4s ease-out";
                flugBuchstabe.style.fontSize = "220px";
            });

            // Schritt 2: kurz stehen lassen, dann zur Zielposition fliegen
            setTimeout(function () {
                flugBuchstabe.style.transition =
                    "left 1s ease-in-out, top 1s ease-in-out, font-size 1s ease-in-out";
                flugBuchstabe.style.left = zielX + "px";
                flugBuchstabe.style.top = zielY + "px";
                flugBuchstabe.style.fontSize = "70px";
            }, 900);

            // Schritt 3: Einflug fertig, ab jetzt normal im Kreis mitdrehen
            setTimeout(function () {

                if (flugBuchstabe.parentNode) {
                    flugSchicht.removeChild(flugBuchstabe);
                }

                flugAktiv[id] = false;
                angekommen[id] = true;

                renderOrbit();

            }, 900 + 1000);
        }

        // Erstes Laden: vorhandene Buchstaben direkt anzeigen
        supabaseClient
            .from("Buchstaben")
            .select("*")
            .order("id", { ascending: true })
            .then(function (response) {

                if (response.error) {
                    console.error("SUPABASE FEHLER:", response.error);
                    return;
                }

                platziereOhneEinflug(response.data);
            });

        // Neuer Buchstabe kommt live dazu: Einflug-Animation starten
        supabaseClient
            .channel("buchstaben-live")
            .on(
                "postgres_changes",
                { event: "INSERT", schema: "public", table: "Buchstaben" },
                function (payload) {
                    starteEinflug(payload.new);
                }
            )
            .subscribe();

    </script>

</body>
</html>
