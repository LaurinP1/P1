<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mein P</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        #dreiDBereich {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #buchstabenSchicht {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #flugSchicht {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        #qrBereich {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 30;

            background: white;
            padding: 10px;
            border-radius: 10px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #qrBereich img {
            width: 130px;
            height: 130px;
            display: block;
        }

        #qrBereich span {
            margin-top: 6px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            color: #222;
        }

        .schwebePlatz {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
        }

        .schwebend {
            position: relative;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }

        @keyframes schwebenA {
            0%   { transform: translate(0vw, 0vh); }
            20%  { transform: translate(14vw, -10vh); }
            40%  { transform: translate(-6vw, -16vh); }
            60%  { transform: translate(-16vw, 6vh); }
            80%  { transform: translate(6vw, 14vh); }
            100% { transform: translate(0vw, 0vh); }
        }

        @keyframes schwebenB {
            0%   { transform: translate(0vw, 0vh); }
            25%  { transform: translate(-15vw, 9vh); }
            50%  { transform: translate(-4vw, -15vh); }
            75%  { transform: translate(13vw, 11vh); }
            100% { transform: translate(0vw, 0vh); }
        }

        @keyframes schwebenC {
            0%   { transform: translate(0vw, 0vh); }
            20%  { transform: translate(10vw, 13vh); }
            45%  { transform: translate(-12vw, 15vh); }
            70%  { transform: translate(-14vw, -12vh); }
            90%  { transform: translate(9vw, -14vh); }
            100% { transform: translate(0vw, 0vh); }
        }

        @keyframes schwebenD {
            0%   { transform: translate(0vw, 0vh); }
            30%  { transform: translate(-13vw, -13vh); }
            55%  { transform: translate(12vw, -9vh); }
            80%  { transform: translate(8vw, 15vh); }
            100% { transform: translate(0vw, 0vh); }
        }

        .kleinerBuchstabe {
            position: absolute;
            left: 0;
            top: 0;

            font-family: Arial, sans-serif;
            font-size: 70px;
            font-weight: bold;

            color: transparent;
            background: linear-gradient(180deg, #ffffff 0%, #cfcfcf 35%, #6e6e6e 52%, #a8a8a8 65%, #ffffff 100%);
            background-clip: text;
            -webkit-background-clip: text;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.6));

            animation-name: drehenKlein;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes drehenKlein {
            from { transform: translate(-50%, -50%) perspective(500px) rotateY(0deg); }
            to   { transform: translate(-50%, -50%) perspective(500px) rotateY(360deg); }
        }

        .fliegenderBuchstabe {
            position: absolute;
            transform: translate(-50%, -50%);

            font-family: Arial, sans-serif;
            font-weight: bold;

            color: transparent;
            background: linear-gradient(180deg, #ffffff 0%, #cfcfcf 35%, #6e6e6e 52%, #a8a8a8 65%, #ffffff 100%);
            background-clip: text;
            -webkit-background-clip: text;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.7)) drop-shadow(0 0 40px rgba(255,255,255,0.6));
        }

        .sternBlitz {
            position: absolute;
            width: 90px;
            height: 90px;
            pointer-events: none;
            animation: sternAufblitzen 0.7s ease-out 1;
        }

        .sternBlitz svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.9));
        }

        @keyframes sternAufblitzen {
            0%   { transform: translate(-50%, -50%) scale(0) rotate(0deg);   opacity: 0; }
            35%  { transform: translate(-50%, -50%) scale(1.3) rotate(25deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.5) rotate(55deg); opacity: 0; }
        }
    </style>
</head>

<body>

    <div id="dreiDBereich"></div>

    <div id="buchstabenSchicht"></div>

    <div id="flugSchicht"></div>

    <div id="qrBereich">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=https%3A%2F%2Flaurinp1.github.io%2FP1%2Fgast.html" alt="QR-Code zur Gast-Seite">
        <span>Scan mich</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">

        import * as THREE from "three";
        import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/loaders/GLTFLoader.js";
        import { RoomEnvironment } from "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/environments/RoomEnvironment.js";

        // ================== TEIL 1: DAS 3D-CHROME-P ==================

        var dreiDBereich = document.getElementById("dreiDBereich");

        var szene = new THREE.Scene();
        szene.fog = new THREE.Fog(0x000000, 6, 90);

        var kamera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        kamera.position.set(0, 0, 5);

        var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        dreiDBereich.appendChild(renderer.domElement);

        var pmrem = new THREE.PMREMGenerator(renderer);
        var umgebungsTextur = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
        szene.environment = umgebungsTextur;

        var licht1 = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
        szene.add(licht1);

        var licht2 = new THREE.DirectionalLight(0xffffff, 2);
        licht2.position.set(3, 5, 4);
        szene.add(licht2);

        var lader = new GLTFLoader();
        var modell = null;

        lader.load(
            "p-metallic.glb",
            function (gltf) {

                modell = gltf.scene;
                szene.add(modell);

                var box = new THREE.Box3().setFromObject(modell);
                var groesse = new THREE.Vector3();
                box.getSize(groesse);
                var mitte = new THREE.Vector3();
                box.getCenter(mitte);

                modell.position.sub(mitte);

                var maxSeite = Math.max(groesse.x, groesse.y, groesse.z);
                var skala = 1.9 / maxSeite;
                modell.scale.setScalar(skala);

                modell.traverse(function (kind) {
                    if (kind.isMesh) {
                        kind.material.roughness = 0.08;
                        kind.material.envMapIntensity = 2.2;
                    }
                });
            },
            undefined,
            function (fehler) {
                console.error("FEHLER beim Laden von p-metallic.glb:", fehler);
            }
        );

        window.addEventListener("resize", function () {
            kamera.aspect = window.innerWidth / window.innerHeight;
            kamera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ================== KOPIEN, DIE IN DIE TIEFE FLIEGEN ==================

        var kopien = [];              // { mesh, zielX, zielY, zielZ }
        var GENERATIONEN_MAX = 15;    // maximale Anzahl an Kopien, bevor die Rueckkehr beginnt
        var MIN_ABSTAND_KOPIEN = 6;   // Mindestabstand zwischen zwei Kopien im Raum
        var naechsteGeneration = 1;
        var kehrenZurueck = false;    // true, sobald alle Kopien wieder zum Mutter-P zurueckfliegen
        var SPAWN_INTERVALL_MS = 10000; // zum Testen: alle 10 Sekunden (spaeter z.B. auf 60000 stellen)

        function findeFreiePositionImRaum() {

            var versucheMax = 150;

            for (var i = 0; i < versucheMax; i++) {

                var x = zufallsZahl(-16, 16);
                var y = zufallsZahl(-6, 6);
                var z = zufallsZahl(-12, -70);

                var passt = true;

                for (var j = 0; j < kopien.length; j++) {
                    var k = kopien[j];
                    var abstand = Math.sqrt(
                        Math.pow(x - k.zielX, 2) +
                        Math.pow(y - k.zielY, 2) +
                        Math.pow(z - k.zielZ, 2)
                    );
                    if (abstand < MIN_ABSTAND_KOPIEN) {
                        passt = false;
                        break;
                    }
                }

                if (passt) {
                    return { x: x, y: y, z: z };
                }
            }

            // Falls kein freier Platz gefunden wurde, trotzdem eine Position nehmen
            return {
                x: zufallsZahl(-16, 16),
                y: zufallsZahl(-6, 6),
                z: zufallsZahl(-12, -70)
            };
        }

        function spawneKopie() {

            if (!modell || kehrenZurueck) {
                return;
            }

            if (naechsteGeneration > GENERATIONEN_MAX) {
                // Maximum erreicht: alle Kopien fliegen jetzt zurueck zum Mutter-P
                kehrenZurueck = true;
                for (var i = 0; i < kopien.length; i++) {
                    kopien[i].zielX = 0;
                    kopien[i].zielY = 0;
                    kopien[i].zielZ = 0;
                }
                return;
            }

            var kopie = modell.clone();
            kopie.position.set(0, 0, 0);
            szene.add(kopie);

            var ziel = findeFreiePositionImRaum();

            kopien.push({ mesh: kopie, zielX: ziel.x, zielY: ziel.y, zielZ: ziel.z });

            naechsteGeneration += 1;
        }

        setInterval(spawneKopie, SPAWN_INTERVALL_MS);

        function aktualisiereKopien() {

            for (var i = kopien.length - 1; i >= 0; i--) {

                var k = kopien[i];
                k.mesh.position.x += (k.zielX - k.mesh.position.x) * 0.02;
                k.mesh.position.y += (k.zielY - k.mesh.position.y) * 0.02;
                k.mesh.position.z += (k.zielZ - k.mesh.position.z) * 0.02;
                k.mesh.rotation.y += 0.008;

                if (kehrenZurueck) {
                    var abstandZurMitte = k.mesh.position.length();
                    if (abstandZurMitte < 0.3) {
                        szene.remove(k.mesh);
                        kopien.splice(i, 1);
                    }
                }
            }

            // Sobald alle zurueckgekehrt sind: Zyklus von vorne beginnen
            if (kehrenZurueck && kopien.length === 0) {
                kehrenZurueck = false;
                naechsteGeneration = 1;
            }
        }

        function animiereDreiD() {
            requestAnimationFrame(animiereDreiD);

            if (modell) {
                modell.rotation.y += 0.008;
            }

            aktualisiereKopien();

            renderer.render(szene, kamera);
        }

        animiereDreiD();

        // ================== TEIL 2: DIE BUCHSTABEN ==================

        var SUPABASE_URL = "https://kqcmvyanjddcmeooqxaz.supabase.co";
        var SUPABASE_KEY = "sb_publishable_PJWkENh6UaNXozYPPgHauA_86KQNb1z";

        var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        var schicht = document.getElementById("buchstabenSchicht");
        var flugSchicht = document.getElementById("flugSchicht");

        var positionen = {};       // id -> Kreisbahn-Daten (Radius, Winkel, Geschwindigkeit ...)
        var buchstabenText = {};   // id -> der eigentliche Buchstabe (Text)
        var angekommen = {};       // id -> true, sobald er im Kreis mitfliegt
        var flugAktiv = {};        // id -> true, waehrend der Einflug-Animation laeuft

        var ERSTER_RADIUS = 220;          // Mindestabstand zur Bildschirmmitte (wegen dem P), Pixel
        var MINDEST_ABSTAND_BUCHSTABEN = 130;   // Mindestabstand zwischen zwei Buchstaben, Pixel
        var SCHWEBE_VARIANTEN = ["schwebenA", "schwebenB", "schwebenC", "schwebenD"];

        function zufallsZahl(min, max) {
            return Math.random() * (max - min) + min;
        }

        function passtPosition(x, y, breite, hoehe, bisherigePositionen) {

            var mitteX = breite / 2;
            var mitteY = hoehe / 2;

            var abstandZurMitte = Math.hypot(x - mitteX, y - mitteY);
            if (abstandZurMitte < ERSTER_RADIUS) {
                return false;
            }

            for (var i = 0; i < bisherigePositionen.length; i++) {
                var vorhanden = bisherigePositionen[i];
                var abstand = Math.hypot(x - vorhanden.x, y - vorhanden.y);
                if (abstand < MINDEST_ABSTAND_BUCHSTABEN) {
                    return false;
                }
            }

            return true;
        }

        function findeZufallsPosition(breite, hoehe, bisherigePositionen) {

            var versucheMax = 200;

            for (var i = 0; i < versucheMax; i++) {

                var x = zufallsZahl(60, breite - 60);
                var y = zufallsZahl(60, hoehe - 60);

                if (passtPosition(x, y, breite, hoehe, bisherigePositionen)) {
                    return { x: x, y: y };
                }
            }

            // Falls nach vielen Versuchen kein freier Platz gefunden wurde
            // (Bildschirm sehr voll), trotzdem eine zufaellige Position nehmen.
            return {
                x: zufallsZahl(60, breite - 60),
                y: zufallsZahl(60, hoehe - 60)
            };
        }

        function erzeugePositionFuer(index) {

            var breite = window.innerWidth;
            var hoehe = window.innerHeight;

            var bisherigePositionen = [];
            for (var id in positionen) {
                bisherigePositionen.push(positionen[id]);
            }

            var platz = findeZufallsPosition(breite, hoehe, bisherigePositionen);

            return {
                x: platz.x,
                y: platz.y,
                spinDauer: zufallsZahl(5, 10),
                schwebeVariante: SCHWEBE_VARIANTEN[Math.floor(Math.random() * SCHWEBE_VARIANTEN.length)],
                schwebeDauer: zufallsZahl(18, 35),
                schwebeVerzoegerung: -zufallsZahl(0, 20) // negativer Start, damit nicht alle synchron schweben
            };
        }

        function erzeugeOrbitElement(text, daten) {

            var platz = document.createElement("div");
            platz.className = "schwebePlatz";
            platz.style.left = daten.x + "px";
            platz.style.top = daten.y + "px";

            var schwebend = document.createElement("div");
            schwebend.className = "schwebend";
            schwebend.style.animationName = daten.schwebeVariante;
            schwebend.style.animationDuration = daten.schwebeDauer + "s";
            schwebend.style.animationDelay = daten.schwebeVerzoegerung + "s";

            var buchstabe = document.createElement("div");
            buchstabe.className = "kleinerBuchstabe";
            buchstabe.textContent = text;
            buchstabe.style.animationDuration = daten.spinDauer + "s";

            schwebend.appendChild(buchstabe);
            platz.appendChild(schwebend);

            return platz;
        }

        var orbitElemente = {};    // id -> bereits im Kreis eingefuegtes Element
        var letterWarteschlange = {}; // Buchstabe (z.B. "A") -> Liste von ids, in Reihenfolge des Erscheinens
        var MAX_PRO_BUCHSTABE = 10;

        function entferneBuchstabenElement(id) {

            var element = orbitElemente[id];
            if (!element) {
                return;
            }

            element.style.transition = "opacity 1s ease-in, filter 1s ease-in";
            element.style.opacity = "0";
            element.style.filter = "blur(6px)";

            setTimeout(function () {
                if (element.parentNode) {
                    schicht.removeChild(element);
                }
            }, 1000);

            delete orbitElemente[id];
            delete positionen[id];
            delete angekommen[id];
            delete buchstabenText[id];
        }

        function begrenzeAufMaximum(buchstabe) {

            if (!letterWarteschlange[buchstabe]) {
                letterWarteschlange[buchstabe] = [];
            }

            while (letterWarteschlange[buchstabe].length >= MAX_PRO_BUCHSTABE) {
                var aeltesteId = letterWarteschlange[buchstabe].shift();
                entferneBuchstabenElement(aeltesteId);
            }
        }

        function fuegeInOrbitEin(id) {

            if (orbitElemente[id]) {
                return; // ist schon drin, nicht doppelt einfuegen
            }

            var buchstabe = buchstabenText[id];

            begrenzeAufMaximum(buchstabe);
            letterWarteschlange[buchstabe].push(id);

            var element = erzeugeOrbitElement(buchstabe, positionen[id]);
            orbitElemente[id] = element;
            schicht.appendChild(element);
        }

        // Buchstaben, die beim ersten Laden der Seite schon vorhanden sind:
        // direkt in den Kreis setzen, ohne die Gross-Einflug-Animation.
        function platziereOhneEinflug(liste) {

            for (var i = 0; i < liste.length; i++) {

                var eintrag = liste[i];
                var id = eintrag.id;

                buchstabenText[id] = eintrag.Buchstabe;

                if (!positionen[id]) {
                    var naechsterIndex = Object.keys(positionen).length;
                    positionen[id] = erzeugePositionFuer(naechsterIndex);
                }

                angekommen[id] = true;
                fuegeInOrbitEin(id);
            }
        }

        // Ein neuer Buchstabe kommt live dazu:
        // 1) Ein glaenzender Fuenf-Stern blitzt oben links kurz auf.
        // 2) Der Buchstabe erscheint dort und fliegt in einer langsamen
        //    Schlangenlinie (wie eine Achterbahn) quer ueber den Bildschirm.
        // 3) Am Ziel reiht er sich in den Kreis ein.
        function starteEinflug(eintrag) {

            var id = eintrag.id;
            var vollerName = eintrag.Name || eintrag.Buchstabe;
            var anfangsBuchstabe = eintrag.Buchstabe;

            if (positionen[id] || flugAktiv[id]) {
                return;
            }

            buchstabenText[id] = anfangsBuchstabe;
            flugAktiv[id] = true;

            var naechsterIndex = Object.keys(positionen).length;
            positionen[id] = erzeugePositionFuer(naechsterIndex);
            var daten = positionen[id];

            var mitteX = window.innerWidth / 2;
            var mitteY = window.innerHeight / 2;

            // Startpunkt oben links (mit etwas Abstand zum Rand, damit man ihn sieht)
            var startX = window.innerWidth * 0.12;
            var startY = window.innerHeight * 0.15;

            var zielX = daten.x;
            var zielY = daten.y;

            // Schritt 1: glaenzender Stern blitzt kurz am Startpunkt auf
            var stern = document.createElement("div");
            stern.className = "sternBlitz";
            stern.style.left = startX + "px";
            stern.style.top = startY + "px";
            stern.innerHTML =
                '<svg viewBox="0 0 100 100">' +
                '<polygon points="50,5 61,39 98,39 68,60 79,95 50,73 21,95 32,60 2,39 39,39" fill="white"/>' +
                '</svg>';
            flugSchicht.appendChild(stern);

            setTimeout(function () {
                if (stern.parentNode) {
                    flugSchicht.removeChild(stern);
                }
            }, 700);

            // Schritt 2: der volle Name erscheint am Startpunkt
            var flugBuchstabe = document.createElement("div");
            flugBuchstabe.className = "fliegenderBuchstabe";
            flugBuchstabe.textContent = vollerName;

            flugBuchstabe.style.left = startX + "px";
            flugBuchstabe.style.top = startY + "px";
            flugBuchstabe.style.fontSize = "0px";
            flugBuchstabe.style.opacity = "1";

            flugSchicht.appendChild(flugBuchstabe);

            requestAnimationFrame(function () {
                flugBuchstabe.style.transition = "font-size 0.4s ease-out";
                flugBuchstabe.style.fontSize = "70px";
            });

            // Schritt 3: nach kurzem Erscheinen langsam in einer Schlangenlinie
            // (wie eine Achterbahn) zur Zielposition im Kreis fliegen.
            // Etwa auf halbem Weg verkuerzt sich der Name zum Anfangsbuchstaben.
            setTimeout(function () {

                var flugDauerMs = 5000;   // Dauer des Flugs (langsam, gut sichtbar)
                var anzahlWellen = 3.5;   // wie oft die Linie hin und her schlaengelt

                var deltaX = zielX - startX;
                var deltaY = zielY - startY;
                var streckenLaenge = Math.hypot(deltaX, deltaY);

                var senkrechtX = -deltaY / streckenLaenge;
                var senkrechtY = deltaX / streckenLaenge;

                var maxAuslenkung = Math.min(140, streckenLaenge * 0.18);

                var startZeit = null;
                var hatSichVerkuerzt = false;

                function schlangenSchritt(zeit) {

                    if (!startZeit) {
                        startZeit = zeit;
                    }

                    var verlauf = Math.min((zeit - startZeit) / flugDauerMs, 1);
                    var eased = 1 - Math.pow(1 - verlauf, 2); // sanftes Ankommen am Ende

                    var grundX = startX + deltaX * eased;
                    var grundY = startY + deltaY * eased;

                    var auslenkung = maxAuslenkung * (1 - eased) * Math.sin(verlauf * anzahlWellen * 2 * Math.PI);

                    var x = grundX + senkrechtX * auslenkung;
                    var y = grundY + senkrechtY * auslenkung;

                    flugBuchstabe.style.left = x + "px";
                    flugBuchstabe.style.top = y + "px";

                    // Auf halbem Weg: Name kurz ausblenden und als
                    // Anfangsbuchstabe wieder einblenden
                    if (!hatSichVerkuerzt && verlauf >= 0.5) {

                        hatSichVerkuerzt = true;

                        flugBuchstabe.style.transition = "opacity 0.18s ease-in-out, font-size 0.18s ease-in-out";
                        flugBuchstabe.style.opacity = "0";

                        setTimeout(function () {
                            flugBuchstabe.textContent = anfangsBuchstabe;
                            flugBuchstabe.style.fontSize = "70px";
                            flugBuchstabe.style.opacity = "1";
                        }, 180);
                    }

                    if (verlauf < 1) {
                        requestAnimationFrame(schlangenSchritt);
                    } else {
                        einflugFertig();
                    }
                }

                requestAnimationFrame(schlangenSchritt);

            }, 900);

            // Sicherheitsnetz: falls die Flugberechnung aus irgendeinem Grund
            // haengen bleibt (z.B. weil das Browserfenster kurz nicht im Fokus war),
            // wird der Buchstabe trotzdem spaetestens jetzt in den Kreis eingefuegt.
            setTimeout(function () {
                if (flugAktiv[id]) {
                    einflugFertig();
                }
            }, 7500);

            function einflugFertig() {

                if (!flugAktiv[id]) {
                    return; // ist schon fertig, nicht doppelt ausfuehren
                }

                if (flugBuchstabe.parentNode) {
                    flugSchicht.removeChild(flugBuchstabe);
                }

                flugAktiv[id] = false;
                angekommen[id] = true;

                fuegeInOrbitEin(id);
            }
        }

        // Erstes Laden: vorhandene Buchstaben direkt anzeigen
        supabaseClient
            .from("Buchstaben")
            .select("*")
            .order("id", { ascending: true })
            .then(function (response) {

                if (response.error) {
                    console.error("SUPABASE FEHLER:", response.error);
                    return;
                }

                platziereOhneEinflug(response.data);
            });

        // Neuer Buchstabe kommt live dazu: Einflug-Animation starten
        supabaseClient
            .channel("buchstaben-live")
            .on(
                "postgres_changes",
                { event: "INSERT", schema: "public", table: "Buchstaben" },
                function (payload) {
                    starteEinflug(payload.new);
                }
            )
            .subscribe();

    </script>

</body>
</html>
