<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mein P</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        .mitte {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .P {
            font-family: Arial, sans-serif;
            font-size: 300px;
            font-weight: bold;
            color: #d6d6d6;

            animation: drehen 8s linear infinite;
        }

        @keyframes drehen {
            from {
                transform: perspective(800px) rotateY(0deg);
            }

            to {
                transform: perspective(800px) rotateY(360deg);
            }
        }

        #buchstabenListe {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;

            display: flex;
            justify-content: center;
            gap: 20px;

            font-family: Arial, sans-serif;
            font-size: 40px;
            color: white;
        }
    </style>
</head>

<body>

    <div class="mitte">
        <div class="P">P</div>
    </div>

    <div id="buchstabenListe"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        var SUPABASE_URL = "https://kqcmvyanjddcmeooqxaz.supabase.co";
        var SUPABASE_KEY = "sb_publishable_PJWkENh6UaNXozYPPgHauA_86KQNb1z";

        var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        var liste = document.getElementById("buchstabenListe");

        function zeigeBuchstaben(buchstaben) {

            liste.innerHTML = "";

            for (var i = 0; i < buchstaben.length; i++) {
                var span = document.createElement("span");
                span.textContent = buchstaben[i].Buchstabe;
                liste.appendChild(span);
            }
        }

        supabaseClient
            .from("Buchstaben")
            .select("*")
            .then(function (response) {

                if (response.error) {
                    console.error("SUPABASE FEHLER:", response.error);
                    return;
                }

                zeigeBuchstaben(response.data);
            });

    </script>

</body>
</html>
