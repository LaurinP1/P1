<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mein P</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .P {
            font-family: Arial, sans-serif;
            font-size: 300px;
            font-weight: bold;
            color: silver;

            transform-style: preserve-3d;

            animation: drehen 8s linear infinite;
        }

        @keyframes drehen {
            from {
                transform: perspective(800px) rotateY(0deg);
            }

            to {
                transform: perspective(800px) rotateY(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="P">P</div>

</body>
</html>
