<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mein P</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        #dreiDBereich {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .orbitPunkt {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
        }

        .orbitDreher {
            animation-name: orbitDrehung;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes orbitDrehung {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .kleinerBuchstabe {
            position: absolute;
            left: 0;
            top: 0;

            font-family: Arial, sans-serif;
            font-size: 70px;
            font-weight: bold;

            color: transparent;
            background: linear-gradient(180deg, #ffffff 0%, #cfcfcf 35%, #6e6e6e 52%, #a8a8a8 65%, #ffffff 100%);
            background-clip: text;
            -webkit-background-clip: text;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.6));

            animation-name: drehenKlein;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes pulsAufleuchten {
            0%   { filter: drop-shadow(0 1px 1px rgba(0,0,0,0.6)) drop-shadow(0 0 0px rgba(255,255,255,0)); }
            25%  { filter: drop-shadow(0 1px 1px rgba(0,0,0,0.6)) drop-shadow(0 0 35px rgba(255,255,255,1)); }
            100% { filter: drop-shadow(0 1px 1px rgba(0,0,0,0.6)) drop-shadow(0 0 0px rgba(255,255,255,0)); }
        }

        @keyframes drehenKlein {
            from { transform: translate(-50%, -50%) perspective(500px) rotateY(0deg); }
            to   { transform: translate(-50%, -50%) perspective(500px) rotateY(360deg); }
        }
    </style>
</head>

<body>

    <div id="dreiDBereich"></div>

    <div id="buchstabenSchicht"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">

        import * as THREE from "three";
        import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/loaders/GLTFLoader.js";
        import { RoomEnvironment } from "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/environments/RoomEnvironment.js";

        // ================== TEIL 1: DAS 3D-CHROME-P ==================

        var dreiDBereich = document.getElementById("dreiDBereich");

        var szene = new THREE.Scene();

        var kamera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        kamera.position.set(0, 0, 5);

        var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        dreiDBereich.appendChild(renderer.domElement);

        // Fertige "Raum-Umgebung" von three.js, damit das Chrome-Material etwas hat, das es spiegeln kann
        var pmrem = new THREE.PMREMGenerator(renderer);
        var umgebungsTextur = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
        szene.environment = umgebungsTextur;

        var licht1 = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
        szene.add(licht1);

        var licht2 = new THREE.DirectionalLight(0xffffff, 2);
        licht2.position.set(3, 5, 4);
        szene.add(licht2);

        var lader = new GLTFLoader();
        var modell = null;

        lader.load(
            "p-metallic.glb",
            function (gltf) {

                modell = gltf.scene;
                szene.add(modell);

                // Modell automatisch zentrieren und passend skalieren
                var box = new THREE.Box3().setFromObject(modell);
                var groesse = new THREE.Vector3();
                box.getSize(groesse);
                var mitte = new THREE.Vector3();
                box.getCenter(mitte);

                modell.position.sub(mitte);

                var maxSeite = Math.max(groesse.x, groesse.y, groesse.z);
                var skala = 1.9 / maxSeite;
                modell.scale.setScalar(skala);

                modell.traverse(function (kind) {
                    if (kind.isMesh) {
                        kind.material.roughness = 0.08;
                        kind.material.envMapIntensity = 2.2;
                    }
                });
            },
            undefined,
            function (fehler) {
                console.error("FEHLER beim Laden von p-metallic.glb:", fehler);
            }
        );

        window.addEventListener("resize", function () {
            kamera.aspect = window.innerWidth / window.innerHeight;
            kamera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animiereDreiD() {
            requestAnimationFrame(animiereDreiD);

            if (modell) {
                modell.rotation.y += 0.008;
            }

            renderer.render(szene, kamera);
        }

        animiereDreiD();

        // ================== TEIL 2: DIE KREISENDEN BUCHSTABEN ==================

        var SUPABASE_URL = "https://kqcmvyanjddcmeooqxaz.supabase.co";
        var SUPABASE_KEY = "sb_publishable_PJWkENh6UaNXozYPPgHauA_86KQNb1z";

        var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        var schicht = document.getElementById("buchstabenSchicht");

        // Hier merken wir uns die Kreisbahn-Position jedes Buchstabens (nach id),
        // damit er beim Neuzeichnen nicht auf eine andere Bahn springt.
        var positionen = {};

        var ERSTER_RADIUS = 320;    // Abstand des innersten Rings zur Mitte (Pixel)
        var RADIUS_SCHRITT = 150;   // Abstand zwischen den Ringen (Pixel)
        var BOGENABSTAND = 110;     // Mindestabstand zwischen Buchstaben auf einem Ring (Pixel)

        function zufallsZahl(min, max) {
            return Math.random() * (max - min) + min;
        }

        function ringPosition(index) {

            var radius = ERSTER_RADIUS;
            var ringNummer = 0;
            var restIndex = index;

            while (true) {
                var umfang = 2 * Math.PI * radius;
                var platzAufRing = Math.max(6, Math.floor(umfang / BOGENABSTAND));

                if (restIndex < platzAufRing) {
                    var winkel = (360 / platzAufRing) * restIndex;
                    return {
                        radius: radius,
                        winkel: winkel,
                        ringNummer: ringNummer
                    };
                }

                restIndex -= platzAufRing;
                radius += RADIUS_SCHRITT;
                ringNummer += 1;
            }
        }

        function erzeugePositionFuer(index) {

            var ring = ringPosition(index);

            return {
                radius: ring.radius,
                winkel: ring.winkel,
                orbitDauer: zufallsZahl(20, 35),
                spinDauer: zufallsZahl(5, 10),
                richtung: (ring.ringNummer % 2 === 0) ? "normal" : "reverse"
            };
        }

        function erzeugeOrbitElement(text, daten, istNeu) {

            var traeger = document.createElement("div");
            traeger.className = "orbitPunkt";
            traeger.style.transform = "rotate(" + daten.winkel + "deg)";

            var dreher = document.createElement("div");
            dreher.className = "orbitPunkt orbitDreher";
            dreher.style.animationDuration = daten.orbitDauer + "s";
            dreher.style.animationDirection = daten.richtung;

            var abstand = document.createElement("div");
            abstand.className = "orbitPunkt";
            abstand.style.transform = "translateX(" + daten.radius + "px)";

            var buchstabe = document.createElement("div");
            buchstabe.className = "kleinerBuchstabe";
            buchstabe.textContent = text;

            buchstabe.style.animation = daten.spinDauer + "s linear infinite drehenKlein";
            if (istNeu) {
                buchstabe.style.animation += ", pulsAufleuchten 1.4s ease-out 1";
            }

            abstand.appendChild(buchstabe);
            dreher.appendChild(abstand);
            traeger.appendChild(dreher);

            return traeger;
        }

        function zeigeBuchstaben(buchstabenListe) {

            schicht.innerHTML = "";

            for (var i = 0; i < buchstabenListe.length; i++) {

                var eintrag = buchstabenListe[i];
                var id = eintrag.id;

                var istNeu = !positionen[id];

                if (istNeu) {
                    var naechsterIndex = Object.keys(positionen).length;
                    positionen[id] = erzeugePositionFuer(naechsterIndex);
                }

                var element = erzeugeOrbitElement(eintrag.Buchstabe, positionen[id], istNeu);
                schicht.appendChild(element);
            }
        }

        function ladeAlleBuchstaben() {
            supabaseClient
                .from("Buchstaben")
                .select("*")
                .order("id", { ascending: true })
                .then(function (response) {

                    if (response.error) {
                        console.error("SUPABASE FEHLER:", response.error);
                        return;
                    }

                    zeigeBuchstaben(response.data);
                });
        }

        ladeAlleBuchstaben();

        supabaseClient
            .channel("buchstaben-live")
            .on(
                "postgres_changes",
                { event: "INSERT", schema: "public", table: "Buchstaben" },
                function (payload) {
                    ladeAlleBuchstaben();
                }
            )
            .subscribe();

    </script>

</body>
</html>
