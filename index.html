<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mein P</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        #dreiDBereich {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #flugSchicht {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        #qrBereich {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 30;

            background: white;
            padding: 10px;
            border-radius: 10px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #qrBereich img {
            width: 130px;
            height: 130px;
            display: block;
        }

        #qrBereich span {
            margin-top: 6px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            color: #222;
        }

        .sternBlitz {
            position: absolute;
            width: 90px;
            height: 90px;
            pointer-events: none;
            animation: sternAufblitzen 0.7s ease-out 1;
        }

        .sternBlitz svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.9));
        }

        @keyframes sternAufblitzen {
            0%   { transform: translate(-50%, -50%) scale(0) rotate(0deg);   opacity: 0; }
            35%  { transform: translate(-50%, -50%) scale(1.3) rotate(25deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.5) rotate(55deg); opacity: 0; }
        }
    </style>
</head>

<body>

    <div id="dreiDBereich"></div>

    <div id="flugSchicht"></div>

    <div id="qrBereich">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=https%3A%2F%2Flaurinp1.github.io%2FP1%2Fgast.html" alt="QR-Code zur Gast-Seite">
        <span>Scan mich</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">

        import * as THREE from "three";
        import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/loaders/GLTFLoader.js";
        import { RoomEnvironment } from "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/environments/RoomEnvironment.js";
        import { FontLoader } from "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/loaders/FontLoader.js";
        import { TextGeometry } from "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/geometries/TextGeometry.js";

        // ================== TEIL 1: DAS 3D-CHROME-P ==================

        var dreiDBereich = document.getElementById("dreiDBereich");

        var szene = new THREE.Scene();

        var kamera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        kamera.position.set(0, 0, 5);

        var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        dreiDBereich.appendChild(renderer.domElement);

        var pmrem = new THREE.PMREMGenerator(renderer);
        var umgebungsTextur = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
        szene.environment = umgebungsTextur;

        var licht1 = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
        szene.add(licht1);

        var licht2 = new THREE.DirectionalLight(0xffffff, 2);
        licht2.position.set(3, 5, 4);
        szene.add(licht2);

        var lader = new GLTFLoader();
        var modell = null;

        lader.load(
            "p-metallic.glb",
            function (gltf) {

                modell = gltf.scene;
                szene.add(modell);

                var box = new THREE.Box3().setFromObject(modell);
                var groesse = new THREE.Vector3();
                box.getSize(groesse);
                var mitte = new THREE.Vector3();
                box.getCenter(mitte);

                modell.position.sub(mitte);

                var maxSeite = Math.max(groesse.x, groesse.y, groesse.z);
                var skala = 1.9 / maxSeite;
                modell.scale.setScalar(skala);

                modell.traverse(function (kind) {
                    if (kind.isMesh) {
                        kind.material.roughness = 0.08;
                        kind.material.envMapIntensity = 2.2;
                    }
                });
            },
            undefined,
            function (fehler) {
                console.error("FEHLER beim Laden von p-metallic.glb:", fehler);
            }
        );

        window.addEventListener("resize", function () {
            kamera.aspect = window.innerWidth / window.innerHeight;
            kamera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ================== ANIMATIONS-SCHLEIFE ==================

        function animiereDreiD(zeitMs) {
            requestAnimationFrame(animiereDreiD);

            if (modell) {
                modell.rotation.y += 0.008;
            }

            aktualisiereSchwebendeBuchstaben((zeitMs || 0) / 1000);

            renderer.render(szene, kamera);
        }

        animiereDreiD(0);

        // ================== TEIL 2: DIE BUCHSTABEN (ECHTE 3D-TEXT-OBJEKTE) ==================

        var SUPABASE_URL = "https://kqcmvyanjddcmeooqxaz.supabase.co";
        var SUPABASE_KEY = "sb_publishable_PJWkENh6UaNXozYPPgHauA_86KQNb1z";

        var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        var flugSchicht = document.getElementById("flugSchicht"); // fuer den Stern-Sparkle-Effekt (bleibt flaches HTML)

        var chromeMaterialBuchstaben = new THREE.MeshPhysicalMaterial({
            color: 0x6b6262,
            metalness: 1,
            roughness: 0.08,
            envMapIntensity: 2.2
        });

        var schriftart = null;           // geladene 3D-Schriftart
        var wennSchriftBereit = [];       // Funktionen, die auf die Schriftart warten

        function schriftartAusfuehrenSobaldBereit(funktion) {
            if (schriftart) {
                funktion();
            } else {
                wennSchriftBereit.push(funktion);
            }
        }

        var fontLader = new FontLoader();
        fontLader.load(
            "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/fonts/helvetiker_bold.typeface.json",
            function (geladeneSchrift) {
                schriftart = geladeneSchrift;
                for (var i = 0; i < wennSchriftBereit.length; i++) {
                    wennSchriftBereit[i]();
                }
                wennSchriftBereit = [];
            },
            undefined,
            function (fehler) {
                console.error("FEHLER beim Laden der 3D-Schriftart:", fehler);
            }
        );

        function erzeugeTextMesh(text, groesse) {
            var geometrie = new TextGeometry(text, {
                font: schriftart,
                size: groesse,
                height: groesse * 0.25,
                curveSegments: 8,
                bevelEnabled: true,
                bevelThickness: groesse * 0.03,
                bevelSize: groesse * 0.02,
                bevelSegments: 4
            });
            geometrie.center();
            return new THREE.Mesh(geometrie, chromeMaterialBuchstaben);
        }

        // ---- Positionierung im 3D-Raum ----

        var positionen = {};        // id -> { x, y, z, Schwebe-/Dreh-Parameter }
        var buchstabenText = {};    // id -> der Anfangsbuchstabe
        var buchstabenObjekte = {}; // id -> das Mesh, das gerade in der Szene ist
        var angekommen = {};        // id -> true, sobald er frei schwebt
        var flugAktiv = {};         // id -> true, waehrend der Einflug laeuft
        var letterWarteschlange = {}; // Buchstabe -> Liste von ids, in Reihenfolge des Erscheinens
        var MAX_PRO_BUCHSTABE = 10;

        var RAUM_BREITE = 7;         // x-Bereich: -RAUM_BREITE bis +RAUM_BREITE
        var RAUM_HOEHE = 3.6;        // y-Bereich: -RAUM_HOEHE bis +RAUM_HOEHE
        var RAUM_TIEFE_VORN = 2;     // z-Bereich vorne (naeher an der Kamera)
        var RAUM_TIEFE_HINTEN = -3;  // z-Bereich hinten
        var MINDEST_ABSTAND_ZENTRUM = 2.6;   // Abstand zum P in der Mitte
        var MINDEST_ABSTAND_BUCHSTABEN = 1.8;

        function zufallsZahl(min, max) {
            return Math.random() * (max - min) + min;
        }

        function passtPosition3D(x, y, z, bisherige) {

            var abstandZurMitte = Math.sqrt(x * x + y * y + z * z);
            if (abstandZurMitte < MINDEST_ABSTAND_ZENTRUM) {
                return false;
            }

            for (var i = 0; i < bisherige.length; i++) {
                var v = bisherige[i];
                var abstand = Math.sqrt(
                    Math.pow(x - v.x, 2) + Math.pow(y - v.y, 2) + Math.pow(z - v.z, 2)
                );
                if (abstand < MINDEST_ABSTAND_BUCHSTABEN) {
                    return false;
                }
            }

            return true;
        }

        function findeFreiePosition() {

            var bisherige = [];
            for (var id in positionen) {
                bisherige.push(positionen[id]);
            }

            var versucheMax = 150;

            for (var i = 0; i < versucheMax; i++) {

                var x = zufallsZahl(-RAUM_BREITE, RAUM_BREITE);
                var y = zufallsZahl(-RAUM_HOEHE, RAUM_HOEHE);
                var z = zufallsZahl(RAUM_TIEFE_HINTEN, RAUM_TIEFE_VORN);

                if (passtPosition3D(x, y, z, bisherige)) {
                    return { x: x, y: y, z: z };
                }
            }

            return {
                x: zufallsZahl(-RAUM_BREITE, RAUM_BREITE),
                y: zufallsZahl(-RAUM_HOEHE, RAUM_HOEHE),
                z: zufallsZahl(RAUM_TIEFE_HINTEN, RAUM_TIEFE_VORN)
            };
        }

        function erzeugePositionFuer() {

            var platz = findeFreiePosition();

            return {
                x: platz.x,
                y: platz.y,
                z: platz.z,
                phaseX: zufallsZahl(0, Math.PI * 2),
                phaseY: zufallsZahl(0, Math.PI * 2),
                phaseZ: zufallsZahl(0, Math.PI * 2),
                schwebeGeschwindigkeit: zufallsZahl(0.15, 0.35),
                schwebeAmplitude: zufallsZahl(0.5, 1.1),
                spinGeschwindigkeit: zufallsZahl(0.006, 0.014)
            };
        }

        // ---- Ein-, Aus- und Aktualisieren der Buchstaben-Objekte ----

        function entferneBuchstabenObjekt(id) {

            var mesh = buchstabenObjekte[id];
            if (!mesh) {
                return;
            }

            var startSkala = mesh.scale.x;
            var startZeit = null;
            var dauer = 900;

            function schrumpfen(zeit) {
                if (!startZeit) {
                    startZeit = zeit;
                }
                var verlauf = Math.min((zeit - startZeit) / dauer, 1);
                var skala = startSkala * (1 - verlauf);
                mesh.scale.setScalar(Math.max(skala, 0.0001));

                if (verlauf < 1) {
                    requestAnimationFrame(schrumpfen);
                } else {
                    szene.remove(mesh);
                }
            }
            requestAnimationFrame(schrumpfen);

            delete buchstabenObjekte[id];
            delete positionen[id];
            delete angekommen[id];
            delete buchstabenText[id];
        }

        function begrenzeAufMaximum(buchstabe) {

            if (!letterWarteschlange[buchstabe]) {
                letterWarteschlange[buchstabe] = [];
            }

            while (letterWarteschlange[buchstabe].length >= MAX_PRO_BUCHSTABE) {
                var aeltesteId = letterWarteschlange[buchstabe].shift();
                entferneBuchstabenObjekt(aeltesteId);
            }
        }

        function fuegeInSzeneEin(id) {

            if (buchstabenObjekte[id]) {
                return;
            }

            var buchstabe = buchstabenText[id];

            begrenzeAufMaximum(buchstabe);
            letterWarteschlange[buchstabe].push(id);

            var mesh = erzeugeTextMesh(buchstabe, 0.9);
            var daten = positionen[id];
            mesh.position.set(daten.x, daten.y, daten.z);

            szene.add(mesh);
            buchstabenObjekte[id] = mesh;
        }

        function platziereOhneEinflug(liste) {

            for (var i = 0; i < liste.length; i++) {

                var eintrag = liste[i];
                var id = eintrag.id;

                buchstabenText[id] = eintrag.Buchstabe;

                if (!positionen[id]) {
                    positionen[id] = erzeugePositionFuer();
                }

                angekommen[id] = true;
                fuegeInSzeneEin(id);
            }
        }

        function aktualisiereSchwebendeBuchstaben(zeitSek) {

            for (var id in buchstabenObjekte) {

                var mesh = buchstabenObjekte[id];
                var daten = positionen[id];
                if (!mesh || !daten) {
                    continue;
                }

                var dx = Math.sin(zeitSek * daten.schwebeGeschwindigkeit + daten.phaseX) * daten.schwebeAmplitude;
                var dy = Math.cos(zeitSek * daten.schwebeGeschwindigkeit * 0.8 + daten.phaseY) * daten.schwebeAmplitude;
                var dz = Math.sin(zeitSek * daten.schwebeGeschwindigkeit * 0.6 + daten.phaseZ) * daten.schwebeAmplitude * 0.5;

                mesh.position.set(daten.x + dx, daten.y + dy, daten.z + dz);
                mesh.rotation.y += daten.spinGeschwindigkeit;
            }
        }

        // ---- Der grosse Name-Einflug ----

        function starteEinflug(eintrag) {

            var id = eintrag.id;
            var vollerName = eintrag.Name || eintrag.Buchstabe;
            var anfangsBuchstabe = eintrag.Buchstabe;

            if (positionen[id] || flugAktiv[id]) {
                return;
            }

            schriftartAusfuehrenSobaldBereit(function () {

                buchstabenText[id] = anfangsBuchstabe;
                flugAktiv[id] = true;

                positionen[id] = erzeugePositionFuer();
                var daten = positionen[id];

                // Startpunkt oben links im 3D-Raum (nah an der Kamera, gut sichtbar)
                var startX = -5.5;
                var startY = 2.6;
                var startZ = 2.5;

                // --- Stern-Sparkle: bleibt ein flaches HTML-Element oben auf dem Bildschirm ---
                var sternX = window.innerWidth * 0.12;
                var sternY = window.innerHeight * 0.15;

                var stern = document.createElement("div");
                stern.className = "sternBlitz";
                stern.style.left = sternX + "px";
                stern.style.top = sternY + "px";
                stern.innerHTML =
                    '<svg viewBox="0 0 100 100">' +
                    '<polygon points="50,5 61,39 98,39 68,60 79,95 50,73 21,95 32,60 2,39 39,39" fill="white"/>' +
                    '</svg>';
                flugSchicht.appendChild(stern);

                setTimeout(function () {
                    if (stern.parentNode) {
                        flugSchicht.removeChild(stern);
                    }
                }, 700);

                // --- Der volle Name erscheint als 3D-Text am Startpunkt ---
                var nameMesh = erzeugeTextMesh(vollerName, 0.01); // erstmal winzig, waechst gleich
                nameMesh.position.set(startX, startY, startZ);
                szene.add(nameMesh);

                var wachstumStart = null;
                var wachstumDauer = 550;

                setTimeout(function () {

                    function wachsen(zeit) {
                        if (!wachstumStart) {
                            wachstumStart = zeit;
                        }
                        var verlauf = Math.min((zeit - wachstumStart) / wachstumDauer, 1);
                        // leichter Ueberschwung (Pop-Effekt), simpel gehalten
                        var ueberschwung = 1 + 0.15 * Math.sin(verlauf * Math.PI);
                        var skala = verlauf * ueberschwung;

                        nameMesh.scale.setScalar(Math.max(skala, 0.0001));

                        if (verlauf < 1) {
                            requestAnimationFrame(wachsen);
                        } else {
                            starteFlugPhase();
                        }
                    }
                    requestAnimationFrame(wachsen);

                }, 250);

                function starteFlugPhase() {

                    var flugDauerMs = 5000;
                    var hatSichVerkuerzt = false;
                    var aktuellesMesh = nameMesh;

                    var startZeit = null;

                    function schritt(zeit) {

                        if (!startZeit) {
                            startZeit = zeit;
                        }
                        var verlauf = Math.min((zeit - startZeit) / flugDauerMs, 1);
                        var eased = 1 - Math.pow(1 - verlauf, 2);

                        var x = startX + (daten.x - startX) * eased;
                        var y = startY + (daten.y - startY) * eased;
                        var z = startZ + (daten.z - startZ) * eased;

                        // sanftes Schwenken quer zur Flugrichtung, statt schnurgerade
                        var schwenk = Math.sin(verlauf * Math.PI * 2.5) * 1.1 * (1 - eased);

                        // leichte Groessenvariation waehrend des Flugs
                        var groessenPuls = 1 + 0.12 * Math.sin(verlauf * Math.PI * 3);

                        aktuellesMesh.position.set(x + schwenk, y, z);
                        aktuellesMesh.rotation.y += 0.02;
                        aktuellesMesh.scale.setScalar(groessenPuls);

                        // Etwa auf halbem Weg: Name verschwindet, Anfangsbuchstabe erscheint
                        if (!hatSichVerkuerzt && verlauf >= 0.5) {

                            hatSichVerkuerzt = true;

                            szene.remove(aktuellesMesh);

                            var buchstabenMesh = erzeugeTextMesh(anfangsBuchstabe, 0.7);
                            buchstabenMesh.position.copy(aktuellesMesh.position);
                            szene.add(buchstabenMesh);

                            aktuellesMesh = buchstabenMesh;
                        }

                        if (verlauf < 1) {
                            requestAnimationFrame(schritt);
                        } else {
                            fertig();
                        }
                    }

                    function fertig() {

                        if (aktuellesMesh) {
                            szene.remove(aktuellesMesh);
                        }

                        flugAktiv[id] = false;
                        angekommen[id] = true;

                        fuegeInSzeneEin(id);
                    }

                    requestAnimationFrame(schritt);

                    // Sicherheitsnetz: falls irgendwas haengen bleibt, trotzdem fertig machen
                    setTimeout(function () {
                        if (flugAktiv[id]) {
                            fertig();
                        }
                    }, flugDauerMs + 2000);
                }
            });
        }

        // ---- Supabase: erstes Laden + Live-Updates ----
        // (wartet, bis die 3D-Schriftart fertig geladen ist)

        schriftartAusfuehrenSobaldBereit(function () {

            supabaseClient
                .from("Buchstaben")
                .select("*")
                .order("id", { ascending: true })
                .then(function (response) {

                    if (response.error) {
                        console.error("SUPABASE FEHLER:", response.error);
                        return;
                    }

                    platziereOhneEinflug(response.data);
                });

            supabaseClient
                .channel("buchstaben-live")
                .on(
                    "postgres_changes",
                    { event: "INSERT", schema: "public", table: "Buchstaben" },
                    function (payload) {
                        starteEinflug(payload.new);
                    }
                )
                .subscribe();
        });

    </script>

</body>
</html>
