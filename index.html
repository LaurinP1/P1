<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mein P</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        .buehne {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .mitte {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .P {
            font-family: Arial, sans-serif;
            font-size: 300px;
            font-weight: bold;
            color: #d6d6d6;

            animation: drehenGross 8s linear infinite;
        }

        @keyframes drehenGross {
            from { transform: perspective(800px) rotateY(0deg); }
            to   { transform: perspective(800px) rotateY(360deg); }
        }

        .kleinerBuchstabe {
            position: absolute;

            font-family: Arial, sans-serif;
            font-size: 70px;
            font-weight: bold;
            color: #d6d6d6;

            animation-name: drehenKlein;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes drehenKlein {
            from { transform: perspective(500px) rotateY(0deg); }
            to   { transform: perspective(500px) rotateY(360deg); }
        }
    </style>
</head>

<body>

    <div class="buehne">
        <div class="mitte">
            <div class="P">P</div>
        </div>

        <div id="buchstabenSchicht"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        var SUPABASE_URL = "https://kqcmvyanjddcmeooqxaz.supabase.co";
        var SUPABASE_KEY = "sb_publishable_PJWkENh6UaNXozYPPgHauA_86KQNb1z";

        var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        var schicht = document.getElementById("buchstabenSchicht");

        var positionen = {};

        var MINDEST_ABSTAND = 130;
        var MINDEST_ABSTAND_MITTE = 220;

        function zufallsZahl(min, max) {
            return Math.random() * (max - min) + min;
        }

        function passtPosition(x, y, breite, hoehe) {

            var mitteX = breite / 2;
            var mitteY = hoehe / 2;

            var abstandZurMitte = Math.hypot(x - mitteX, y - mitteY);
            if (abstandZurMitte < MINDEST_ABSTAND_MITTE) {
                return false;
            }

            for (var id in positionen) {
                var vorhanden = positionen[id];
                var abstand = Math.hypot(x - vorhanden.x, y - vorhanden.y);
                if (abstand < MINDEST_ABSTAND) {
                    return false;
                }
            }

            return true;
        }

        function findePosition(breite, hoehe) {

            var versucheMax = 200;

            for (var i = 0; i < versucheMax; i++) {

                var x = zufallsZahl(60, breite - 60);
                var y = zufallsZahl(60, hoehe - 60);

                if (passtPosition(x, y, breite, hoehe)) {
                    return { x: x, y: y };
                }
            }

            return {
                x: zufallsZahl(60, breite - 60),
                y: zufallsZahl(60, hoehe - 60)
            };
        }

        function zeigeBuchstaben(buchstabenListe) {

            var breite = window.innerWidth;
            var hoehe = window.innerHeight;

            schicht.innerHTML = "";

            for (var i = 0; i < buchstabenListe.length; i++) {

                var eintrag = buchstabenListe[i];
                var id = eintrag.id;

                if (!positionen[id]) {
                    positionen[id] = findePosition(breite, hoehe);
                }

                var pos = positionen[id];

                var div = document.createElement("div");
                div.className = "kleinerBuchstabe";
                div.textContent = eintrag.Buchstabe;

                div.style.left = pos.x + "px";
                div.style.top = pos.y + "px";

                var dauer = zufallsZahl(5, 10).toFixed(1);
                div.style.animationDuration = dauer + "s";

                schicht.appendChild(div);
            }
        }

        function ladeAlleBuchstaben() {
            supabaseClient
                .from("Buchstaben")
                .select("*")
                .then(function (response) {

                    if (response.error) {
                        console.error("SUPABASE FEHLER:", response.error);
                        return;
                    }

                    zeigeBuchstaben(response.data);
                });
        }

        ladeAlleBuchstaben();

        supabaseClient
            .channel("buchstaben-live")
            .on(
                "postgres_changes",
                { event: "INSERT", schema: "public", table: "Buchstaben" },
                function (payload) {
                    ladeAlleBuchstaben();
                }
            )
            .subscribe();

    </script>

</body>
</html>
