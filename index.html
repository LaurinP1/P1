<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mein P</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        #dreiDBereich {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #qrBereich {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 30;

            background: white;
            padding: 10px;
            border-radius: 10px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #qrBereich img {
            width: 130px;
            height: 130px;
            display: block;
        }

        #qrBereich span {
            margin-top: 6px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
            color: #222;
        }
    </style>
</head>

<body>

    <div id="dreiDBereich"></div>

    <div id="qrBereich">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=https%3A%2F%2Flaurinp1.github.io%2FP1%2Fgast.html" alt="QR-Code zur Gast-Seite">
        <span>Scan mich</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">

        import * as THREE from "three";
        import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/loaders/GLTFLoader.js";
        import { RoomEnvironment } from "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/environments/RoomEnvironment.js";
        import { FontLoader } from "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/loaders/FontLoader.js";
        import { TextGeometry } from "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/geometries/TextGeometry.js";

        // ================== TEIL 1: DAS 3D-CHROME-P ==================

        var dreiDBereich = document.getElementById("dreiDBereich");

        var szene = new THREE.Scene();

        var kamera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        kamera.position.set(0, 0, 5);

        var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        dreiDBereich.appendChild(renderer.domElement);

        var pmrem = new THREE.PMREMGenerator(renderer);
        var umgebungsTextur = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
        szene.environment = umgebungsTextur;

        var licht1 = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
        szene.add(licht1);

        var licht2 = new THREE.DirectionalLight(0xffffff, 2);
        licht2.position.set(3, 5, 4);
        szene.add(licht2);

        var lader = new GLTFLoader();
        var modell = null;

        lader.load(
            "p-metallic.glb",
            function (gltf) {

                modell = gltf.scene;
                szene.add(modell);

                var box = new THREE.Box3().setFromObject(modell);
                var groesse = new THREE.Vector3();
                box.getSize(groesse);
                var mitte = new THREE.Vector3();
                box.getCenter(mitte);

                modell.position.sub(mitte);

                var maxSeite = Math.max(groesse.x, groesse.y, groesse.z);
                var skala = 1.9 / maxSeite;
                modell.scale.setScalar(skala);

                modell.traverse(function (kind) {
                    if (kind.isMesh) {
                        kind.material.roughness = 0.08;
                        kind.material.envMapIntensity = 2.2;
                    }
                });
            },
            undefined,
            function (fehler) {
                console.error("FEHLER beim Laden von p-metallic.glb:", fehler);
            }
        );

        window.addEventListener("resize", function () {
            kamera.aspect = window.innerWidth / window.innerHeight;
            kamera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ================== ANIMATIONS-SCHLEIFE ==================

        function animiereDreiD(zeitMs) {
            requestAnimationFrame(animiereDreiD);

            if (modell) {
                modell.rotation.y += 0.008;
            }

            aktualisiereSchwebendeBuchstaben((zeitMs || 0) / 1000);

            renderer.render(szene, kamera);
        }

        animiereDreiD(0);

        // ================== TEIL 2: DIE BUCHSTABEN (ECHTE 3D-TEXT-OBJEKTE) ==================

        var SUPABASE_URL = "https://kqcmvyanjddcmeooqxaz.supabase.co";
        var SUPABASE_KEY = "sb_publishable_PJWkENh6UaNXozYPPgHauA_86KQNb1z";

        var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // (kein flugSchicht mehr noetig - alles passiert jetzt in 3D)

        var chromeMaterialBuchstaben = new THREE.MeshPhysicalMaterial({
            color: 0x6b6262,
            metalness: 1,
            roughness: 0.08,
            envMapIntensity: 2.2
        });

        var schriftart = null;           // geladene 3D-Schriftart
        var wennSchriftBereit = [];       // Funktionen, die auf die Schriftart warten

        function schriftartAusfuehrenSobaldBereit(funktion) {
            if (schriftart) {
                funktion();
            } else {
                wennSchriftBereit.push(funktion);
            }
        }

        var fontLader = new FontLoader();
        fontLader.load(
            "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/fonts/helvetiker_bold.typeface.json",
            function (geladeneSchrift) {
                schriftart = geladeneSchrift;
                for (var i = 0; i < wennSchriftBereit.length; i++) {
                    wennSchriftBereit[i]();
                }
                wennSchriftBereit = [];
            },
            undefined,
            function (fehler) {
                console.error("FEHLER beim Laden der 3D-Schriftart:", fehler);
            }
        );

        function erzeugeTextMesh(text, groesse) {
            var geometrie = new TextGeometry(text, {
                font: schriftart,
                size: groesse,
                height: groesse * 0.25,
                curveSegments: 8,
                bevelEnabled: true,
                bevelThickness: groesse * 0.03,
                bevelSize: groesse * 0.02,
                bevelSegments: 4
            });
            geometrie.center();
            return new THREE.Mesh(geometrie, chromeMaterialBuchstaben);
        }

        // ---- Positionierung im 3D-Raum ----

        var positionen = {};        // id -> { x, y, z, Schwebe-/Dreh-Parameter }
        var buchstabenText = {};    // id -> der Anfangsbuchstabe
        var buchstabenObjekte = {}; // id -> das Mesh, das gerade in der Szene ist
        var angekommen = {};        // id -> true, sobald er frei schwebt
        var flugAktiv = {};         // id -> true, waehrend der Einflug laeuft
        var letterWarteschlange = {}; // Buchstabe -> Liste von ids, in Reihenfolge des Erscheinens
        var MAX_PRO_BUCHSTABE = 10;

        var RAUM_TIEFE_VORN = 1;      // z-Bereich vorne (naeher an der Kamera)
        var RAUM_TIEFE_HINTEN = -2.5; // z-Bereich hinten
        var SICHTFELD_SICHERHEIT = 0.6; // Anteil des sichtbaren Bereichs, der tatsaechlich genutzt wird
        var ZENTRUM_SICHERHEIT_ANTEIL = 0.34; // Anteil des sichtbaren Bereichs an der jeweiligen Tiefe, der frei vom P bleiben muss
        var ZENTRUM_PUFFER = 0.5; // zusaetzlicher fester Puffer, damit auch das sanfte Schweben nie ins P hineinreicht
        var MINDEST_ABSTAND_BUCHSTABEN = 1.8;

        function zufallsZahl(min, max) {
            return Math.random() * (max - min) + min;
        }

        // Berechnet, wie breit/hoch der sichtbare Bereich der Kamera bei einer
        // bestimmten Tiefe (z) tatsaechlich ist - damit nichts ausserhalb landet.
        function sichtbareGroesseBeiTiefe(z) {
            var distanz = kamera.position.z - z;
            var vFovRad = (kamera.fov * Math.PI) / 180;
            var halbeHoehe = Math.tan(vFovRad / 2) * distanz;
            var halbeBreite = halbeHoehe * kamera.aspect;
            return { halbeBreite: halbeBreite, halbeHoehe: halbeHoehe };
        }

        // Wie weit ein Buchstabe an dieser Tiefe (z) mindestens von der Mitte
        // (dem P) entfernt sein muss, damit es auf dem Bildschirm nie
        // ueberschneidet - skaliert mit der Kamera-Perspektive.
        function mindestAbstandZentrumBeiTiefe(z) {
            var sichtbar = sichtbareGroesseBeiTiefe(z);
            return sichtbar.halbeHoehe * ZENTRUM_SICHERHEIT_ANTEIL + ZENTRUM_PUFFER;
        }

        function passtPosition3D(x, y, z, bisherige) {

            // Wichtig: nur x/y zaehlen (Bildschirmebene), nicht die Tiefe (z) -
            // sonst wuerde ein Punkt direkt hinter/vor dem P (x=0, y=0) faelschlich
            // als "weit genug entfernt" gelten, nur weil er in der Tiefe versetzt ist.
            var abstandZurMitte = Math.sqrt(x * x + y * y);
            if (abstandZurMitte < mindestAbstandZentrumBeiTiefe(z)) {
                return false;
            }

            for (var i = 0; i < bisherige.length; i++) {
                var v = bisherige[i];
                var abstand = Math.sqrt(
                    Math.pow(x - v.x, 2) + Math.pow(y - v.y, 2) + Math.pow(z - v.z, 2)
                );
                if (abstand < MINDEST_ABSTAND_BUCHSTABEN) {
                    return false;
                }
            }

            return true;
        }

        function findeFreiePosition() {

            var bisherige = [];
            for (var id in positionen) {
                bisherige.push(positionen[id]);
            }

            var versucheMax = 150;

            for (var i = 0; i < versucheMax; i++) {

                var z = zufallsZahl(RAUM_TIEFE_HINTEN, RAUM_TIEFE_VORN);
                var sichtbar = sichtbareGroesseBeiTiefe(z);
                var x = zufallsZahl(-sichtbar.halbeBreite * SICHTFELD_SICHERHEIT, sichtbar.halbeBreite * SICHTFELD_SICHERHEIT);
                var y = zufallsZahl(-sichtbar.halbeHoehe * SICHTFELD_SICHERHEIT, sichtbar.halbeHoehe * SICHTFELD_SICHERHEIT);

                if (passtPosition3D(x, y, z, bisherige)) {
                    return { x: x, y: y, z: z };
                }
            }

            var zFallback = zufallsZahl(RAUM_TIEFE_HINTEN, RAUM_TIEFE_VORN);
            var sichtbarFallback = sichtbareGroesseBeiTiefe(zFallback);
            return {
                x: zufallsZahl(-sichtbarFallback.halbeBreite * SICHTFELD_SICHERHEIT, sichtbarFallback.halbeBreite * SICHTFELD_SICHERHEIT),
                y: zufallsZahl(-sichtbarFallback.halbeHoehe * SICHTFELD_SICHERHEIT, sichtbarFallback.halbeHoehe * SICHTFELD_SICHERHEIT),
                z: zFallback
            };
        }

        function erzeugePositionFuer() {

            var platz = findeFreiePosition();

            return {
                x: platz.x,
                y: platz.y,
                z: platz.z,
                phaseX: zufallsZahl(0, Math.PI * 2),
                phaseY: zufallsZahl(0, Math.PI * 2),
                phaseZ: zufallsZahl(0, Math.PI * 2),
                schwebeGeschwindigkeit: zufallsZahl(0.15, 0.35),
                schwebeAmplitude: zufallsZahl(0.25, 0.45),
                spinGeschwindigkeit: zufallsZahl(0.006, 0.014)
            };
        }

        // ---- Ein-, Aus- und Aktualisieren der Buchstaben-Objekte ----

        function entferneBuchstabenObjekt(id) {

            var mesh = buchstabenObjekte[id];
            if (!mesh) {
                return;
            }

            var startSkala = mesh.scale.x;
            var startZeit = null;
            var dauer = 900;

            function schrumpfen(zeit) {
                if (!startZeit) {
                    startZeit = zeit;
                }
                var verlauf = Math.min((zeit - startZeit) / dauer, 1);
                var skala = startSkala * (1 - verlauf);
                mesh.scale.setScalar(Math.max(skala, 0.0001));

                if (verlauf < 1) {
                    requestAnimationFrame(schrumpfen);
                } else {
                    szene.remove(mesh);
                }
            }
            requestAnimationFrame(schrumpfen);

            delete buchstabenObjekte[id];
            delete positionen[id];
            delete angekommen[id];
            delete buchstabenText[id];
        }

        function begrenzeAufMaximum(buchstabe) {

            if (!letterWarteschlange[buchstabe]) {
                letterWarteschlange[buchstabe] = [];
            }

            while (letterWarteschlange[buchstabe].length >= MAX_PRO_BUCHSTABE) {
                var aeltesteId = letterWarteschlange[buchstabe].shift();
                entferneBuchstabenObjekt(aeltesteId);
            }
        }

        function fuegeInSzeneEin(id) {

            if (buchstabenObjekte[id]) {
                return;
            }

            var buchstabe = buchstabenText[id];

            begrenzeAufMaximum(buchstabe);
            letterWarteschlange[buchstabe].push(id);

            var mesh = erzeugeTextMesh(buchstabe, 0.7);
            var daten = positionen[id];
            mesh.position.set(daten.x, daten.y, daten.z);

            szene.add(mesh);
            buchstabenObjekte[id] = mesh;
        }

        function platziereOhneEinflug(liste) {

            for (var i = 0; i < liste.length; i++) {

                var eintrag = liste[i];
                var id = eintrag.id;

                buchstabenText[id] = eintrag.Buchstabe;

                if (!positionen[id]) {
                    positionen[id] = erzeugePositionFuer();
                }

                angekommen[id] = true;
                fuegeInSzeneEin(id);
            }
        }

        function aktualisiereSchwebendeBuchstaben(zeitSek) {

            for (var id in buchstabenObjekte) {

                var mesh = buchstabenObjekte[id];
                var daten = positionen[id];
                if (!mesh || !daten) {
                    continue;
                }

                var dx = Math.sin(zeitSek * daten.schwebeGeschwindigkeit + daten.phaseX) * daten.schwebeAmplitude;
                var dy = Math.cos(zeitSek * daten.schwebeGeschwindigkeit * 0.8 + daten.phaseY) * daten.schwebeAmplitude;
                var dz = Math.sin(zeitSek * daten.schwebeGeschwindigkeit * 0.6 + daten.phaseZ) * daten.schwebeAmplitude * 0.5;

                var x = daten.x + dx;
                var y = daten.y + dy;
                var z = daten.z + dz;

                // Laufende Sicherung: falls das Schweben den Buchstaben zu nah
                // ans P bringen wuerde, sanft nach aussen schieben.
                var mindestAbstand = mindestAbstandZentrumBeiTiefe(z);
                var abstandZurMitte = Math.sqrt(x * x + y * y);
                if (abstandZurMitte < mindestAbstand && abstandZurMitte > 0.0001) {
                    var faktor = mindestAbstand / abstandZurMitte;
                    x *= faktor;
                    y *= faktor;
                }

                mesh.position.set(x, y, z);
                mesh.rotation.y += daten.spinGeschwindigkeit;
            }
        }

        // ---- Der grosse Name-Einflug ----

        // Baut eine Gruppe aus einzelnen 3D-Buchstaben-Meshes fuer ein Wort,
        // nebeneinander angeordnet und zentriert.
        function erzeugeNameGruppe(text, buchstabenGroesse) {

            var gruppe = new THREE.Group();
            var kinder = [];
            var luecke = buchstabenGroesse * 0.18;

            var breiten = [];
            var gesamtBreite = 0;

            for (var i = 0; i < text.length; i++) {
                var zeichen = text[i] === " " ? " " : text[i];
                var mesh = erzeugeTextMesh(zeichen === " " ? "-" : zeichen, buchstabenGroesse);
                if (zeichen === " ") {
                    mesh.visible = false;
                }
                mesh.geometry.computeBoundingBox();
                var breite = mesh.geometry.boundingBox.max.x - mesh.geometry.boundingBox.min.x;
                breiten.push(breite);
                gesamtBreite += breite + (i < text.length - 1 ? luecke : 0);

                kinder.push(mesh);
            }

            var x = -gesamtBreite / 2;

            for (var j = 0; j < kinder.length; j++) {
                var b = breiten[j];
                kinder[j].position.x = x + b / 2;
                x += b + luecke;

                gruppe.add(kinder[j]);
            }

            return { gruppe: gruppe, kinder: kinder };
        }

        function starteEinflug(eintrag) {

            var id = eintrag.id;
            var vollerName = eintrag.Name || eintrag.Buchstabe;
            var anfangsBuchstabe = eintrag.Buchstabe;

            if (positionen[id] || flugAktiv[id]) {
                return;
            }

            schriftartAusfuehrenSobaldBereit(function () {

                buchstabenText[id] = anfangsBuchstabe;
                flugAktiv[id] = true;

                positionen[id] = erzeugePositionFuer();
                var daten = positionen[id];

                // Der Name-Buchstaben-Verbund, ausgehend vom eigentlichen Anfangsbuchstaben
                var nameOhneRest = vollerName.charAt(0) === anfangsBuchstabe.toLowerCase()
                    ? anfangsBuchstabe + vollerName.slice(1)
                    : vollerName;

                var aufbau = erzeugeNameGruppe(nameOhneRest, 0.9);
                var gruppe = aufbau.gruppe;
                var kinder = aufbau.kinder;

                // Start: winzig und weit entfernt (in Richtung des Zielorts), kommt naeher
                gruppe.position.set(daten.x, daten.y, daten.z - 55);
                gruppe.scale.setScalar(0.03);
                szene.add(gruppe);

                var flugDauerMs = 3200;
                var startZeit = null;

                function anflugSchritt(zeit) {

                    if (!startZeit) {
                        startZeit = zeit;
                    }
                    var verlauf = Math.min((zeit - startZeit) / flugDauerMs, 1);
                    var eased = 1 - Math.pow(1 - verlauf, 3);

                    var z = (daten.z - 55) + 55 * eased;
                    var skala = 0.03 + (1 - 0.03) * eased;

                    // sanfter Bogen/Schlingern waehrend des Anflugs, klingt zum Ende hin ab
                    var schlingerX = Math.sin(verlauf * Math.PI * 2) * 0.8 * (1 - eased);
                    var schlingerY = Math.cos(verlauf * Math.PI * 1.6) * 0.4 * (1 - eased);

                    gruppe.position.set(daten.x + schlingerX, daten.y + schlingerY, z);
                    gruppe.scale.setScalar(skala);
                    // Bewusst KEINE Drehung waehrend des Anflugs, sonst ist der
                    // Name beim Ankommen zufaellig spiegelverkehrt/unlesbar.

                    if (verlauf < 1) {
                        requestAnimationFrame(anflugSchritt);
                    } else {
                        gruppe.position.set(daten.x, daten.y, daten.z);
                        gruppe.scale.setScalar(1);
                        gruppe.rotation.y = 0;
                        starteWartePhase();
                    }
                }

                requestAnimationFrame(anflugSchritt);

                // Nach der Ankunft: bleibt lesbar (keine Drehung), pendelt
                // aber sanft ein kleines Stueck in der Tiefe vor und zurueck.
                var wartePhaseAktiv = false;

                function starteWartePhase() {

                    wartePhaseAktiv = true;
                    var wartePhaseStart = null;

                    function pendeln(zeit) {

                        if (!wartePhaseAktiv) {
                            return;
                        }

                        if (!wartePhaseStart) {
                            wartePhaseStart = zeit;
                        }
                        var vergangeneSek = (zeit - wartePhaseStart) / 1000;

                        var pendelZ = Math.sin(vergangeneSek * 1.1) * 0.35;
                        gruppe.position.z = daten.z + pendelZ;

                        requestAnimationFrame(pendeln);
                    }
                    requestAnimationFrame(pendeln);

                    setTimeout(function () {
                        starteAufloesen();
                    }, 500);
                }

                function starteAufloesen() {

                    var zumAufloesen = kinder.slice(1); // alle ausser dem ersten Buchstaben bleiben nicht
                    var verzoegerungProBuchstabe = 220;
                    var aufloeseDauer = 500;
                    var nochOffen = zumAufloesen.length;

                    if (nochOffen === 0) {
                        alleWegAusserErster();
                        return;
                    }

                    // Der verbleibende erste Buchstabe steht anfangs am Wortanfang,
                    // nicht in der Gruppenmitte. Damit er beim Uebergang nicht
                    // ploetzlich "springt", gleitet er waehrend des Aufloesens
                    // sanft zur Mitte (x = 0) - genau dahin, wo er danach uebergeben wird.
                    var ersterBuchstabe = kinder[0];
                    var startX = ersterBuchstabe.position.x;
                    var zentrierDauer = (zumAufloesen.length - 1) * verzoegerungProBuchstabe + aufloeseDauer;
                    var zentrierStart = null;

                    function zentrieren(zeit) {
                        if (!zentrierStart) {
                            zentrierStart = zeit;
                        }
                        var verlauf = Math.min((zeit - zentrierStart) / zentrierDauer, 1);
                        var eased = 1 - Math.pow(1 - verlauf, 2);
                        ersterBuchstabe.position.x = startX * (1 - eased);

                        if (verlauf < 1) {
                            requestAnimationFrame(zentrieren);
                        }
                    }
                    requestAnimationFrame(zentrieren);

                    for (var i = 0; i < zumAufloesen.length; i++) {
                        (function (mesh, verzoegerung) {
                            setTimeout(function () {
                                loeseMeshAuf(mesh, aufloeseDauer, function () {
                                    nochOffen -= 1;
                                    if (nochOffen === 0) {
                                        alleWegAusserErster();
                                    }
                                });
                            }, verzoegerung);
                        })(zumAufloesen[i], i * verzoegerungProBuchstabe);
                    }
                }

                function loeseMeshAuf(mesh, dauer, callback) {

                    var startZeitAufloesen = null;

                    function schritt(zeit) {
                        if (!startZeitAufloesen) {
                            startZeitAufloesen = zeit;
                        }
                        var verlauf = Math.min((zeit - startZeitAufloesen) / dauer, 1);
                        mesh.scale.setScalar(Math.max(1 - verlauf, 0.0001));

                        if (verlauf < 1) {
                            requestAnimationFrame(schritt);
                        } else {
                            gruppe.remove(mesh);
                            if (callback) {
                                callback();
                            }
                        }
                    }
                    requestAnimationFrame(schritt);
                }

                function alleWegAusserErster() {
                    wartePhaseAktiv = false;
                    szene.remove(gruppe);

                    flugAktiv[id] = false;
                    angekommen[id] = true;

                    fuegeInSzeneEin(id);
                }

                // Sicherheitsnetz: falls irgendwas haengen bleibt, trotzdem fertig machen
                setTimeout(function () {
                    if (flugAktiv[id]) {
                        alleWegAusserErster();
                    }
                }, flugDauerMs + 500 + kinder.length * 220 + 500 + 2000);
            });
        }

        // ---- Supabase: erstes Laden + Live-Updates ----
        // (wartet, bis die 3D-Schriftart fertig geladen ist)

        schriftartAusfuehrenSobaldBereit(function () {

            supabaseClient
                .from("Buchstaben")
                .select("*")
                .order("id", { ascending: true })
                .then(function (response) {

                    if (response.error) {
                        console.error("SUPABASE FEHLER:", response.error);
                        return;
                    }

                    platziereOhneEinflug(response.data);
                });

            supabaseClient
                .channel("buchstaben-live")
                .on(
                    "postgres_changes",
                    { event: "INSERT", schema: "public", table: "Buchstaben" },
                    function (payload) {
                        starteEinflug(payload.new);
                    }
                )
                .subscribe();
        });

    </script>
