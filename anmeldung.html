<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJEKT_1 – Anmeldung</title>
<style>
  :root {
    --bg: #0d0f14;
    --card: #161a22;
    --text: #f2f4f8;
    --muted: #9aa3b2;
    --accent: #6ee7d8;
    --accent-dark: #0d0f14;
    --error: #ff8080;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #1a2030, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 20px;
    padding: 8px 28px 36px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    text-align: center;
    overflow: hidden;
  }

  /* --- 3D Glas-Geschenk --- */
  .gift-stage {
    position: relative;
    width: calc(100% + 56px);
    margin: 0 -28px 4px;
    aspect-ratio: 1 / 0.9;
    max-height: 320px;
  }
  .gift-stage canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }
  .gift-fallback {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 4.5rem;
  }

  h1 {
    font-size: 1.45rem;
    margin: 0 0 8px;
    letter-spacing: 0.01em;
    line-height: 1.25;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 26px;
    font-size: 0.95rem;
    line-height: 1.4;
  }
  label {
    display: block;
    text-align: left;
    font-size: 0.85rem;
    color: var(--muted);
    margin: 18px 0 6px;
  }
  input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid #2a3040;
    background: #0f1319;
    color: var(--text);
    font-size: 1rem;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    margin-top: 26px;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-dark);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .msg {
    margin-top: 18px;
    font-size: 0.9rem;
    min-height: 1.2em;
  }
  .msg.error { color: var(--error); }
  .msg.success { color: var(--accent); }
  .hint {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 4px;
    text-align: left;
  }
  .done-icon {
    font-size: 2.6rem;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

  <div class="card" id="card">

    <form id="form">
      <div class="gift-stage" id="giftStage">
        <div class="gift-fallback" id="giftFallback">🎁</div>
      </div>

      <h1>Du willst ein Geschenk vom PROJEKT_1-Team?</h1>
      <p class="sub">Kein Problem! Trag dich einfach ein – der Rest ist unsere Überraschung 😉</p>

      <label for="name">Vorname</label>
      <input type="text" id="name" placeholder="Vorname" required autocomplete="given-name">

      <label for="begleitpersonen">Begleitpersonen <span style="opacity:.7">(optional)</span></label>
      <input type="number" id="begleitpersonen" min="0" step="1" placeholder="0" inputmode="numeric">
      <div class="hint">Bringst du noch jemanden mit? Falls nicht, einfach frei lassen.</div>

      <button type="submit" id="submitBtn">Ich bin dabei!</button>
      <div class="msg" id="msg"></div>
    </form>

    <div id="thankyou" style="display:none;">
      <div class="done-icon">🎉</div>
      <h1>Perfekt, du bist drin!</h1>
      <p class="sub">Wir freuen uns auf dich – dein Platz beim PROJEKT_1-Team ist reserviert.</p>
    </div>
  </div>

<script type="module">
  // --- 3D Glas-Geschenkbox (Three.js) ---
  try {
    const THREE = await import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js");
    const { RoomEnvironment } = await import("https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/environments/RoomEnvironment.js");
    const { RoundedBoxGeometry } = await import("https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/geometries/RoundedBoxGeometry.js");

    const stage = document.getElementById("giftStage");

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
    camera.position.set(0, 0.35, 6.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    stage.appendChild(renderer.domElement);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    // Licht
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const key = new THREE.DirectionalLight(0xffffff, 1.4);
    key.position.set(3, 4, 5);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x8fd9ff, 0.6);
    rim.position.set(-4, -2, -3);
    scene.add(rim);

    const giftGroup = new THREE.Group();
    scene.add(giftGroup);

    // Glasbox
    const boxGeo = new RoundedBoxGeometry(2.6, 2.0, 2.0, 5, 0.16);
    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0xf5fbff,
      metalness: 0,
      roughness: 0.04,
      transmission: 1,
      thickness: 1.4,
      ior: 1.45,
      clearcoat: 0.6,
      clearcoatRoughness: 0.1,
      envMapIntensity: 1.3,
      attenuationColor: new THREE.Color(0x9fe8ff),
      attenuationDistance: 3.5
    });
    const box = new THREE.Mesh(boxGeo, glassMat);
    giftGroup.add(box);

    // Rotes Geschenkband (zwei sich kreuzende Streifen)
    const ribbonMat = new THREE.MeshPhysicalMaterial({
      color: 0xc81e2c,
      roughness: 0.3,
      metalness: 0.05,
      clearcoat: 0.7,
      clearcoatRoughness: 0.2
    });

    const bandV = new THREE.Mesh(new THREE.BoxGeometry(0.42, 2.08, 2.08), ribbonMat);
    giftGroup.add(bandV);
    const bandH = new THREE.Mesh(new THREE.BoxGeometry(2.68, 2.08, 0.42), ribbonMat);
    giftGroup.add(bandH);

    // Schleife oben
    const bowGroup = new THREE.Group();
    bowGroup.position.set(0, 1.18, 0);
    giftGroup.add(bowGroup);

    function makeLoop(sign) {
      const torus = new THREE.Mesh(
        new THREE.TorusGeometry(0.42, 0.15, 16, 32),
        ribbonMat
      );
      torus.scale.set(1, 1.3, 0.7);
      torus.position.set(sign * 0.4, 0.1, 0);
      torus.rotation.z = sign * 0.5;
      torus.rotation.x = 0.3;
      return torus;
    }
    bowGroup.add(makeLoop(1));
    bowGroup.add(makeLoop(-1));

    const knot = new THREE.Mesh(new THREE.SphereGeometry(0.24, 24, 24), ribbonMat);
    knot.position.set(0, 0.05, 0.1);
    bowGroup.add(knot);

    // Bandenden vorne
    function makeTail(sign) {
      const shape = new THREE.Shape();
      shape.moveTo(-0.22, 0);
      shape.lineTo(0.22, 0);
      shape.lineTo(0.12, -0.9);
      shape.lineTo(0, -0.7);
      shape.lineTo(-0.12, -0.9);
      shape.closePath();
      const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.06, bevelEnabled: false });
      const tail = new THREE.Mesh(geo, ribbonMat);
      tail.position.set(sign * 0.17, 1.05, 1.02);
      tail.rotation.y = sign * 0.15;
      tail.rotation.z = sign * -0.08;
      return tail;
    }
    giftGroup.add(makeTail(1));
    giftGroup.add(makeTail(-1));

    giftGroup.rotation.x = -0.12;

    function resize() {
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);
    resize();
    window.addEventListener("load", resize);
    setTimeout(resize, 300);

    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t += 0.008;
      giftGroup.rotation.y = Math.sin(t) * 0.55 + t * 0.25;
      giftGroup.position.y = Math.sin(t * 1.3) * 0.08;
      renderer.render(scene, camera);
    }
    animate();
  } catch (err) {
    console.error("3D-Geschenk konnte nicht geladen werden:", err);
    document.getElementById("giftFallback").style.display = "flex";
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // --- Supabase-Verbindung ---
  const SUPABASE_URL = "https://kqcmvyanjddcmeooqxaz.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxY212eWFuamRkY21lb29xeGF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODA5MzksImV4cCI6MjEwNDQ1NjkzOX0.L9xyydjhnMPk62nCeGuxaU3TQ7mnWAXKQ4xVn6payPA";

  const form = document.getElementById("form");
  const msg = document.getElementById("msg");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (typeof window.supabase === "undefined") {
      msg.textContent = "Verbindung konnte nicht aufgebaut werden. Bitte Seite neu laden (evtl. Internet/WLAN prüfen) und nochmal versuchen.";
      msg.className = "msg error";
      return;
    }

    const name = document.getElementById("name").value.trim();
    const begleitRaw = document.getElementById("begleitpersonen").value.trim();
    const begleitpersonen = begleitRaw === "" ? 0 : parseInt(begleitRaw, 10);

    if (!name) {
      msg.textContent = "Bitte gib deinen Namen ein.";
      msg.className = "msg error";
      return;
    }
    if (isNaN(begleitpersonen) || begleitpersonen < 0) {
      msg.textContent = "Bitte eine gültige Zahl bei Begleitpersonen eingeben.";
      msg.className = "msg error";
      return;
    }

    submitBtn.disabled = true;
    msg.textContent = "Einen Moment …";
    msg.className = "msg";

    try {
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { error } = await sb
        .from("Anmeldungen")
        .insert([{ Name: name, Begleitpersonen: begleitpersonen }]);

      if (error) {
        console.error(error);
        msg.textContent = "Da ist etwas schiefgelaufen. Bitte versuch es noch einmal.";
        msg.className = "msg error";
        submitBtn.disabled = false;
        return;
      }

      document.getElementById("form").style.display = "none";
      document.getElementById("thankyou").style.display = "block";
    } catch (err) {
      console.error(err);
      msg.textContent = "Da ist etwas schiefgelaufen. Bitte versuch es noch einmal.";
      msg.className = "msg error";
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
