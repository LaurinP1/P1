<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>3D Buchstabe Test</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            font-family: monospace;
            font-size: 16px;
            z-index: 10;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <div id="status">Lade...</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">

        import * as THREE from "three";
        import { FontLoader } from "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/loaders/FontLoader.js";
        import { TextGeometry } from "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/geometries/TextGeometry.js";
        import { RoomEnvironment } from "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/environments/RoomEnvironment.js";

        var statusFeld = document.getElementById("status");
        function log(text) {
            statusFeld.textContent += "\n" + text;
            console.log(text);
        }

        log("Schritt 1: Module geladen.");

        var szene = new THREE.Scene();

        var kamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        kamera.position.set(0, 0, 6);

        var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        document.body.appendChild(renderer.domElement);

        var pmrem = new THREE.PMREMGenerator(renderer);
        szene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

        var licht1 = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
        szene.add(licht1);

        var licht2 = new THREE.DirectionalLight(0xffffff, 2);
        licht2.position.set(3, 5, 4);
        szene.add(licht2);

        log("Schritt 2: Szene, Licht, Umgebung fertig.");

        var chromeMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x6b6262,
            metalness: 1,
            roughness: 0.08,
            envMapIntensity: 2.2
        });

        var buchstabenMesh = null;

        log("Schritt 3: Lade Schriftart ...");

        var fontLader = new FontLoader();

        fontLader.load(
            "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/fonts/helvetiker_bold.typeface.json",
            function (font) {

                log("ERFOLG: Schriftart geladen.");

                var geometrie = new TextGeometry("A", {
                    font: font,
                    size: 2,
                    height: 0.5,
                    curveSegments: 12,
                    bevelEnabled: true,
                    bevelThickness: 0.06,
                    bevelSize: 0.04,
                    bevelSegments: 5
                });

                geometrie.center();

                buchstabenMesh = new THREE.Mesh(geometrie, chromeMaterial);
                szene.add(buchstabenMesh);

                log("Schritt 4: 3D-Buchstabe erzeugt und in Szene eingefuegt.");
            },
            undefined,
            function (fehler) {
                log("FEHLER beim Laden der Schriftart:");
                log(String(fehler));
            }
        );

        function animieren() {
            requestAnimationFrame(animieren);

            if (buchstabenMesh) {
                buchstabenMesh.rotation.y += 0.015;
            }

            renderer.render(szene, kamera);
        }

        animieren();

    </script>

</body>
</html>
