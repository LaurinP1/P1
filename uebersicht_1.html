<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJEKT_1 – Übersicht</title>
<style>
  :root {
    --bg: #0d0f14;
    --card: #161a22;
    --text: #f2f4f8;
    --muted: #9aa3b2;
    --accent: #6ee7d8;
    --border: #2a3040;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    padding: 32px 20px;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 24px;
  }
  .stats {
    display: flex;
    gap: 14px;
    margin-bottom: 28px;
  }
  .stat {
    flex: 1;
    background: var(--card);
    border-radius: 14px;
    padding: 18px;
    text-align: center;
  }
  .stat .num {
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
  }
  .stat .label {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 4px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
  }
  th, td {
    padding: 12px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    font-size: 0.92rem;
  }
  th {
    color: var(--muted);
    font-weight: 500;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  tr:last-child td { border-bottom: none; }
  .empty, .loading, .error {
    color: var(--muted);
    padding: 20px;
    text-align: center;
  }
  .refresh {
    display: inline-block;
    margin-bottom: 20px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>PROJEKT_1 – Anmeldungen</h1>
    <button class="refresh" id="refreshBtn">Aktualisieren</button>

    <div class="stats">
      <div class="stat">
        <div class="num" id="statAnmeldungen">–</div>
        <div class="label">Anmeldungen</div>
      </div>
      <div class="stat">
        <div class="num" id="statPersonen">–</div>
        <div class="label">Personen insgesamt</div>
      </div>
    </div>

    <div id="tableWrap">
      <div class="loading">Lade Daten …</div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://kqcmvyanjddcmeooqxaz.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxY212eWFuamRkY21lb29xeGF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODA5MzksImV4cCI6MjEwNDQ1NjkzOX0.L9xyydjhnMPk62nCeGuxaU3TQ7mnWAXKQ4xVn6payPA";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const tableWrap = document.getElementById("tableWrap");
  const statAnmeldungen = document.getElementById("statAnmeldungen");
  const statPersonen = document.getElementById("statPersonen");

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  async function load() {
    tableWrap.innerHTML = '<div class="loading">Lade Daten …</div>';

    const { data, error } = await supabase
      .from("Anmeldungen")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      console.error(error);
      tableWrap.innerHTML = '<div class="error">Daten konnten nicht geladen werden.</div>';
      return;
    }

    if (!data || data.length === 0) {
      statAnmeldungen.textContent = "0";
      statPersonen.textContent = "0";
      tableWrap.innerHTML = '<div class="empty">Noch keine Anmeldungen.</div>';
      return;
    }

    let totalPersonen = 0;
    const rows = data.map((row) => {
      const begleitpersonen = row.Begleitpersonen || 0;
      totalPersonen += 1 + begleitpersonen;
      const datum = new Date(row.created_at).toLocaleString("de-DE", {
        day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"
      });
      return `<tr>
        <td>${escapeHtml(row.Name)}</td>
        <td>${begleitpersonen}</td>
        <td>${datum}</td>
      </tr>`;
    }).join("");

    statAnmeldungen.textContent = data.length;
    statPersonen.textContent = totalPersonen;

    tableWrap.innerHTML = `
      <table>
        <thead>
          <tr><th>Name</th><th>Begleitung</th><th>Eingetragen</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  document.getElementById("refreshBtn").addEventListener("click", load);
  load();
</script>
</body>
</html>
