<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>P1 – Dein Buchstabe</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 30px;
        }

        input {
            width: 100px;
            height: 70px;
            font-size: 50px;
            text-align: center;
            text-transform: uppercase;
            border: none;
            border-radius: 10px;
        }

        button {
            display: block;
            margin: 20px auto 0;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Gib deinen Anfangsbuchstaben ein</h1>

        <input
            id="buchstabe"
            type="text"
            maxlength="1"
            autocomplete="off"
            autofocus
        >

        <button onclick="senden()">Buchstaben hinzufügen</button>

    </div>

    <script>
        function senden() {

            const feld = document.getElementById("buchstabe");

            const buchstabe = feld.value.toUpperCase();

            if (buchstabe === "") {
                alert("Bitte gib einen Buchstaben ein.");
                return;
            }

            alert("Dein Buchstabe ist: " + buchstabe);
        }
    </script>

</body>
</html>
