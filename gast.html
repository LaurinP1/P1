<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>P1 – Dein Buchstabe</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: white;
            color: black;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 100%;
            text-align: center;
        }

        h1 {
            margin: 0 0 30px 0;
            font-size: 32px;
        }

        input {
            display: block;
            width: 100px;
            height: 70px;
            margin: 0 auto;

            font-size: 50px;
            text-align: center;
            text-transform: uppercase;

            border: 1px solid #ccc;
            border-radius: 10px;
        }

        button {
            display: block;
            margin: 20px auto 0;

            padding: 15px 30px;
            font-size: 18px;

            border: none;
            border-radius: 10px;

            cursor: pointer;
        }

        #meldung {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>ANFANGSBUCHSTABE</h1>

        <input
            type="text"
            maxlength="1"
            autocomplete="off"
            autofocus
        >

        <button>
            Buchstaben hinzufügen
        </button>

        <div id="meldung"></div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL = "https://kqcmvyanjddcmeooqxaz.supabase.co/rest/v1/";
        const SUPABASE_KEY = "sb_publishable_PJWkENh6UaNXozYPPgHauA_86KQNb1z";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        const feld = document.querySelector("input");
        const button = document.querySelector("button");
        const meldung = document.querySelector("#meldung");


        button.addEventListener("click", async function () {

            const buchstabe = feld.value.trim().toUpperCase();

            if (buchstabe === "") {
                meldung.textContent =
                    "Bitte gib einen Buchstaben ein.";
                return;
            }

            meldung.textContent =
                "Wird gespeichert...";


            const { error } = await supabaseClient
                .from("Buchstaben")
                .insert([
                    {
                        buchstabe: buchstabe
                    }
                ]);


            if (error) {

                console.error(
                    "SUPABASE FEHLER:",
                    error
                );

                meldung.textContent =
                    "Fehler beim Speichern.";

                return;
            }


            meldung.textContent =
                "Dein Buchstabe wurde hinzugefügt!";

            feld.value = "";
            feld.focus();

        });

    </script>

</body>
</html>
