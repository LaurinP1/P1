<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>P1 - Dein Name</title>

    <style>
        body {
            margin: 0;
            position: relative;
            overflow: hidden;

            background: white;

            color: black;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            text-align: center;
        }

        .hintergrundName {
            position: absolute;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: bold;
            text-transform: uppercase;

            color: transparent;
            background: linear-gradient(180deg, #ffffff 0%, #cfcfcf 35%, #6e6e6e 52%, #a8a8a8 65%, #ffffff 100%);
            background-clip: text;
            -webkit-background-clip: text;

            filter: blur(1px);
            opacity: 0.65;
            z-index: 0;
            pointer-events: none;
            white-space: nowrap;
        }

        .box {
            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 400px;
            padding: 30px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 30px;
        }

        #namensfeld {
            width: 90%;
            max-width: 300px;
            height: 60px;
            font-size: 24px;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: bold;
            text-align: center;

            display: block;
            margin: 0 auto;

            border: 1px solid #ccc;
            border-radius: 10px;
        }

        #sendenButton {
            margin-top: 20px;
            padding: 15px 30px;

            font-size: 18px;

            border: none;
            border-radius: 10px;

            cursor: pointer;
        }

        #meldung {
            margin-top: 20px;
            font-size: 18px;
        }

        #dreiDNameBereich {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    
        .geschlossen {
            font-size: 30px;
            font-weight: bold;
            margin: 0;
        }
    </style>
</head>

<body>


    <div class="hintergrundName" style="top: 6%; left: 4%; font-size: 46px; transform: rotate(-8deg);">Oscar</div>
    <div class="hintergrundName" style="top: 26%; right: 4%; font-size: 40px; transform: rotate(6deg);">Jeroen</div>
    <div class="hintergrundName" style="top: 1%; left: 50%; font-size: 40px; transform: translateX(-50%) rotate(-3deg);">Butter</div>
    <div class="hintergrundName" style="bottom: 5%; right: 4%; font-size: 38px; transform: rotate(-6deg);">Camillo</div>
    <div class="hintergrundName" style="bottom: 14%; left: 4%; font-size: 42px; transform: rotate(5deg);">Murks</div>
    <div class="hintergrundName" style="top: 40%; left: 3%; font-size: 40px; transform: rotate(-5deg);">Dewi</div>

    <div class="box">

        <p class="geschlossen">@21:30 Uhr</p>

    </div>

</body>
</html>
