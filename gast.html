<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>P1 - Dein Name</title>

    <style>
        body {
            margin: 0;
            position: relative;
            overflow: hidden;

            background:
                radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 38%),
                radial-gradient(ellipse at 75% 70%, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 32%),
                linear-gradient(160deg,
                    #ffffff 0%,
                    #c4c4c4 10%,
                    #fbfbfb 20%,
                    #5c5c5c 32%,
                    #eeeeee 42%,
                    #7a7a7a 52%,
                    #fdfdfd 62%,
                    #9c9c9c 73%,
                    #ffffff 85%,
                    #b6b6b6 100%);

            color: black;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            text-align: center;
        }

        .hintergrundName {
            position: absolute;
            font-family: Arial, sans-serif;
            font-weight: bold;
            text-transform: uppercase;

            color: transparent;
            background: linear-gradient(180deg, #ffffff 0%, #cfcfcf 35%, #6e6e6e 52%, #a8a8a8 65%, #ffffff 100%);
            background-clip: text;
            -webkit-background-clip: text;

            filter: blur(1px);
            opacity: 0.65;
            z-index: 0;
            pointer-events: none;
            white-space: nowrap;
        }

        .box {
            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 400px;
            padding: 30px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 30px;
        }

        #namensfeld {
            width: 90%;
            max-width: 300px;
            height: 60px;
            font-size: 24px;
            text-align: center;

            display: block;
            margin: 0 auto;

            border: 1px solid #ccc;
            border-radius: 10px;
        }

        #sendenButton {
            margin-top: 20px;
            padding: 15px 30px;

            font-size: 18px;

            border: none;
            border-radius: 10px;

            cursor: pointer;
        }

        #meldung {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="hintergrundName" style="top: 6%; left: 4%; font-size: 46px; transform: rotate(-8deg);">Hancii</div>
    <div class="hintergrundName" style="top: 26%; right: 4%; font-size: 40px; transform: rotate(6deg);">Jeroen</div>
    <div class="hintergrundName" style="top: 46%; left: 4%; font-size: 42px; transform: rotate(4deg);">Butter</div>
    <div class="hintergrundName" style="bottom: 20%; left: 4%; font-size: 42px; transform: rotate(5deg);">Sunnyone</div>
    <div class="hintergrundName" style="bottom: 5%; right: 4%; font-size: 38px; transform: rotate(-6deg);">Camillo</div>

    <div class="box">

        <h1>DEIN NAME</h1>

        <input id="namensfeld" type="text" autocomplete="off">

        <button id="sendenButton">Namen hinzufuegen</button>

        <div id="meldung"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        var SUPABASE_URL = "https://kqcmvyanjddcmeooqxaz.supabase.co";
        var SUPABASE_KEY = "sb_publishable_PJWkENh6UaNXozYPPgHauA_86KQNb1z";

        var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        var feld = document.getElementById("namensfeld");
        var button = document.getElementById("sendenButton");
        var meldung = document.getElementById("meldung");

        button.addEventListener("click", function () {

            var name = feld.value.trim();

            if (name === "") {
                meldung.textContent = "Bitte gib deinen Namen ein.";
                return;
            }

            var anfangsBuchstabe = name.charAt(0).toUpperCase();

            meldung.textContent = "Wird gespeichert...";

            supabaseClient
                .from("Buchstaben")
                .insert({
                    Name: name,
                    Buchstabe: anfangsBuchstabe
                })
                .then(function (response) {

                    if (response.error) {
                        console.error("SUPABASE FEHLER:", response.error);
                        meldung.textContent = "Fehler beim Speichern.";
                        return;
                    }

                    meldung.textContent = "Dein Name wurde hinzugefuegt!";
                    feld.value = "";
                    feld.focus();

                });

        });

    </script>

</body>
</html>
