<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>P1 - Dein Name</title>

    <style>
        body {
            margin: 0;
            position: relative;
            overflow: hidden;

            background: white;

            color: black;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            text-align: center;
        }

        .hintergrundName {
            position: absolute;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: bold;
            text-transform: uppercase;

            color: transparent;
            background: linear-gradient(180deg, #ffffff 0%, #cfcfcf 35%, #6e6e6e 52%, #a8a8a8 65%, #ffffff 100%);
            background-clip: text;
            -webkit-background-clip: text;

            filter: blur(1px);
            opacity: 0.65;
            z-index: 0;
            pointer-events: none;
            white-space: nowrap;
        }

        .box {
            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 400px;
            padding: 30px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 30px;
        }

        #namensfeld {
            width: 90%;
            max-width: 300px;
            height: 60px;
            font-size: 24px;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: bold;
            text-align: center;

            display: block;
            margin: 0 auto;

            border: 1px solid #ccc;
            border-radius: 10px;
        }

        #sendenButton {
            margin-top: 20px;
            padding: 15px 30px;

            font-size: 18px;

            border: none;
            border-radius: 10px;

            cursor: pointer;
        }

        #meldung {
            margin-top: 20px;
            font-size: 18px;
        }

        .wegfliegenderName {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(1);

            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: bold;
            font-size: 32px;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;

            color: transparent;
            background-image: linear-gradient(180deg, #ffffff 0%, #a8a8a8 18%, #1a1a1a 45%, #6e6e6e 62%, #ffffff 82%, #9c9c9c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow:
                1px 1px 0px rgba(255,255,255,0.5),
                -1px -1px 0px rgba(0,0,0,0.6);

            z-index: 50;
            pointer-events: none;
        }

        .wegfliegenderName.waechst {
            transform: translate(-50%, -50%) scale(1.7);
        }

        .wegfliegenderName.fliegt {
            transform: translate(-50%, -260vh) scale(0.25);
            opacity: 0;
        }
    </style>
</head>

<body>

    <div class="hintergrundName" style="top: 6%; left: 4%; font-size: 46px; transform: rotate(-8deg);">Hancii</div>
    <div class="hintergrundName" style="top: 26%; right: 4%; font-size: 40px; transform: rotate(6deg);">Jeroen</div>
    <div class="hintergrundName" style="top: 1%; left: 50%; font-size: 40px; transform: translateX(-50%) rotate(-3deg);">Butter</div>
    <div class="hintergrundName" style="bottom: 20%; left: 4%; font-size: 42px; transform: rotate(5deg);">Sunnyone</div>
    <div class="hintergrundName" style="bottom: 5%; right: 4%; font-size: 38px; transform: rotate(-6deg);">Camillo</div>

    <div class="box">

        <h1>DEIN NAME</h1>

        <input id="namensfeld" type="text" autocomplete="off">

        <button id="sendenButton">Namen hinzufuegen</button>

        <div id="meldung"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        var SUPABASE_URL = "https://kqcmvyanjddcmeooqxaz.supabase.co";
        var SUPABASE_KEY = "sb_publishable_PJWkENh6UaNXozYPPgHauA_86KQNb1z";

        var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        var feld = document.getElementById("namensfeld");
        var button = document.getElementById("sendenButton");
        var meldung = document.getElementById("meldung");

        button.addEventListener("click", function () {

            var name = feld.value.trim();

            if (name === "") {
                meldung.textContent = "Bitte gib deinen Namen ein.";
                return;
            }

            var anfangsBuchstabe = name.charAt(0).toUpperCase();

            meldung.textContent = "Wird gespeichert...";

            supabaseClient
                .from("Buchstaben")
                .insert({
                    Name: name,
                    Buchstabe: anfangsBuchstabe
                })
                .then(function (response) {

                    if (response.error) {
                        console.error("SUPABASE FEHLER:", response.error);
                        meldung.textContent = "Fehler beim Speichern.";
                        return;
                    }

                    meldung.textContent = "Dein Name wurde hinzugefuegt!";

                    // Der Name waechst erst langsam, dann fliegt er los - am Ende immer schneller
                    var fliegenderName = document.createElement("div");
                    fliegenderName.className = "wegfliegenderName";
                    fliegenderName.textContent = name;
                    document.body.appendChild(fliegenderName);

                    requestAnimationFrame(function () {
                        requestAnimationFrame(function () {
                            fliegenderName.style.transition = "transform 0.8s ease-out";
                            fliegenderName.classList.add("waechst");
                        });
                    });

                    setTimeout(function () {
                        fliegenderName.style.transition =
                            "transform 1.3s cubic-bezier(0.5, 0, 1, 0.4), opacity 1.3s cubic-bezier(0.5, 0, 1, 0.4)";
                        fliegenderName.classList.remove("waechst");
                        fliegenderName.classList.add("fliegt");
                    }, 800);

                    setTimeout(function () {
                        if (fliegenderName.parentNode) {
                            document.body.removeChild(fliegenderName);
                        }
                    }, 2200);

                    feld.value = "";
                    feld.focus();

                });

        });

    </script>

</body>
</html>
