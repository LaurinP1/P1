<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>P1 - Dein Name</title>

    <style>
        body {
            margin: 0;
            position: relative;
            overflow: hidden;

            background: white;

            color: black;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            text-align: center;
        }

        .hintergrundName {
            position: absolute;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: bold;
            text-transform: uppercase;

            color: transparent;
            background: linear-gradient(180deg, #ffffff 0%, #cfcfcf 35%, #6e6e6e 52%, #a8a8a8 65%, #ffffff 100%);
            background-clip: text;
            -webkit-background-clip: text;

            filter: blur(1px);
            opacity: 0.65;
            z-index: 0;
            pointer-events: none;
            white-space: nowrap;
        }

        .box {
            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 400px;
            padding: 30px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 30px;
        }

        #namensfeld {
            width: 90%;
            max-width: 300px;
            height: 60px;
            font-size: 24px;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: bold;
            text-align: center;

            display: block;
            margin: 0 auto;

            border: 1px solid #ccc;
            border-radius: 10px;
        }

        #sendenButton {
            margin-top: 20px;
            padding: 15px 30px;

            font-size: 18px;

            border: none;
            border-radius: 10px;

            cursor: pointer;
        }

        #meldung {
            margin-top: 20px;
            font-size: 18px;
        }

        #dreiDNameBereich {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>

<body>

    <div id="dreiDNameBereich"></div>

    <div class="hintergrundName" style="top: 6%; left: 4%; font-size: 46px; transform: rotate(-8deg);">Hancii</div>
    <div class="hintergrundName" style="top: 26%; right: 4%; font-size: 40px; transform: rotate(6deg);">Jeroen</div>
    <div class="hintergrundName" style="top: 1%; left: 50%; font-size: 40px; transform: translateX(-50%) rotate(-3deg);">Butter</div>
    <div class="hintergrundName" style="bottom: 20%; left: 4%; font-size: 42px; transform: rotate(5deg);">Sunnyone</div>
    <div class="hintergrundName" style="bottom: 5%; right: 4%; font-size: 38px; transform: rotate(-6deg);">Camillo</div>

    <div class="box">

        <h1>DEIN NAME</h1>

        <input id="namensfeld" type="text" autocomplete="off">

        <button id="sendenButton">Namen hinzufuegen</button>

        <div id="meldung"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">

        import * as THREE from "three";
        import { FontLoader } from "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/loaders/FontLoader.js";
        import { TextGeometry } from "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/geometries/TextGeometry.js";
        import { RoomEnvironment } from "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/environments/RoomEnvironment.js";

        var SUPABASE_URL = "https://kqcmvyanjddcmeooqxaz.supabase.co";
        var SUPABASE_KEY = "sb_publishable_PJWkENh6UaNXozYPPgHauA_86KQNb1z";

        var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        var feld = document.getElementById("namensfeld");
        var button = document.getElementById("sendenButton");
        var meldung = document.getElementById("meldung");

        // ---- Gleiche 3D-Technik wie auf der Hauptseite: exakt dieselben Buchstaben ----

        var dreiDBereich = document.getElementById("dreiDNameBereich");

        var szene = new THREE.Scene();

        var kamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        kamera.position.set(0, 0, 6);

        var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        dreiDBereich.appendChild(renderer.domElement);

        var pmrem = new THREE.PMREMGenerator(renderer);
        szene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

        var licht1 = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
        szene.add(licht1);

        var licht2 = new THREE.DirectionalLight(0xffffff, 2);
        licht2.position.set(3, 5, 4);
        szene.add(licht2);

        var chromeMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x6b6262,
            metalness: 1,
            roughness: 0.08,
            envMapIntensity: 2.2
        });

        var schriftart = null;

        var fontLader = new FontLoader();
        fontLader.load(
            "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/fonts/helvetiker_bold.typeface.json",
            function (geladeneSchrift) {
                schriftart = geladeneSchrift;
            },
            undefined,
            function (fehler) {
                console.error("FEHLER beim Laden der 3D-Schriftart:", fehler);
            }
        );

        window.addEventListener("resize", function () {
            kamera.aspect = window.innerWidth / window.innerHeight;
            kamera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        var aktivesMesh = null;

        // Rechnet einen Bildschirmpunkt (z.B. die Mitte des Eingabefelds) in eine
        // 3D-Weltposition auf der z=0 Ebene um, damit der Name dort "auftaucht",
        // wo der Name gerade eingetippt wurde - statt ploetzlich in der Mitte.
        function bildschirmPunktInWelt(px, py) {
            var ndcX = (px / window.innerWidth) * 2 - 1;
            var ndcY = -(py / window.innerHeight) * 2 + 1;
            var vektor = new THREE.Vector3(ndcX, ndcY, 0.5);
            vektor.unproject(kamera);
            var richtung = vektor.sub(kamera.position).normalize();
            var distanz = -kamera.position.z / richtung.z;
            return kamera.position.clone().add(richtung.multiplyScalar(distanz));
        }

        function animieren() {
            requestAnimationFrame(animieren);
            renderer.render(szene, kamera);
        }
        animieren();

        function zeigeWegfliegendenNamen(text) {

            if (!schriftart) {
                return; // Schriftart noch nicht bereit, dann eben ohne Animation
            }

            var geometrie = new TextGeometry(text.toUpperCase(), {
                font: schriftart,
                size: 0.55,
                height: 0.14,
                curveSegments: 8,
                bevelEnabled: true,
                bevelThickness: 0.02,
                bevelSize: 0.015,
                bevelSegments: 4
            });
            geometrie.center();

            // Material-Zustand zuruecksetzen (das Material wird zwischen
            // aufeinanderfolgenden Namen wiederverwendet)
            chromeMaterial.opacity = 1;
            chromeMaterial.transparent = false;

            var mesh = new THREE.Mesh(geometrie, chromeMaterial);

            // Startet exakt dort, wo das Eingabefeld auf dem Bildschirm sitzt -
            // fuer einen nahtlosen Uebergang vom eingetippten Text zum 3D-Namen.
            var feldRect = feld.getBoundingClientRect();
            var startPos = bildschirmPunktInWelt(
                feldRect.left + feldRect.width / 2,
                feldRect.top + feldRect.height / 2
            );

            mesh.position.copy(startPos);
            mesh.rotation.y = 0;
            mesh.scale.setScalar(0.001);
            szene.add(mesh);
            aktivesMesh = mesh;

            // Phase 1: langsam waechst der Name und gleitet sanft zur Mitte
            var wachstumDauer = 800;
            var wachstumStart = null;
            var zielSkala = 0.75; // moderates Wachstum, nicht zu gross/aufdringlich

            function wachsen(zeit) {
                if (!wachstumStart) {
                    wachstumStart = zeit;
                }
                var verlauf = Math.min((zeit - wachstumStart) / wachstumDauer, 1);
                var eased = 1 - Math.pow(1 - verlauf, 2);
                var skala = 0.001 + (zielSkala - 0.001) * eased;
                mesh.scale.setScalar(skala);
                mesh.rotation.y = 0;

                mesh.position.x = startPos.x * (1 - eased);
                mesh.position.y = startPos.y * (1 - eased);
                mesh.position.z = startPos.z * (1 - eased);

                if (verlauf < 1) {
                    requestAnimationFrame(wachsen);
                } else {
                    fliegtWeg();
                }
            }
            requestAnimationFrame(wachsen);

            // Phase 2: fliegt los - am Ende immer schneller, Richtung "Leinwand" (nach oben, weg)
            function fliegtWeg() {

                var flugDauer = 1300;
                var flugStart = null;
                var startSkala = zielSkala;

                function schritt(zeit) {
                    if (!flugStart) {
                        flugStart = zeit;
                    }
                    var verlauf = Math.min((zeit - flugStart) / flugDauer, 1);
                    var eased = verlauf * verlauf * verlauf; // langsam los, dann immer schneller

                    mesh.position.y = eased * 9;
                    mesh.position.z = eased * -6;
                    mesh.rotation.y = 0;
                    var skala = startSkala * (1 - eased * 0.85);
                    mesh.scale.setScalar(Math.max(skala, 0.01));
                    mesh.material.opacity = 1 - eased;

                    if (verlauf < 1) {
                        requestAnimationFrame(schritt);
                    } else {
                        szene.remove(mesh);
                        if (aktivesMesh === mesh) {
                            aktivesMesh = null;
                        }
                    }
                }
                mesh.material.transparent = true;
                requestAnimationFrame(schritt);
            }
        }

        // ---- Formular-Logik ----

        button.addEventListener("click", function () {

            var name = feld.value.trim();

            if (name === "") {
                meldung.textContent = "Bitte gib deinen Namen ein.";
                return;
            }

            var anfangsBuchstabe = name.charAt(0).toUpperCase();

            meldung.textContent = "Wird gespeichert...";

            supabaseClient
                .from("Buchstaben")
                .insert({
                    Name: name,
                    Buchstabe: anfangsBuchstabe
                })
                .then(function (response) {

                    if (response.error) {
                        console.error("SUPABASE FEHLER:", response.error);
                        meldung.textContent = "Fehler beim Speichern.";
                        return;
                    }

                    meldung.textContent = "Dein Name wurde hinzugefuegt!";

                    zeigeWegfliegendenNamen(name);

                    feld.value = "";
                    feld.focus();

                });

        });

    </script>

</body>
</html>
