<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>P1 - Dein Name</title>

    <style>
        body {
            margin: 0;
            background: linear-gradient(180deg,
                #ffffff 0%,
                #d8d8d8 18%,
                #f4f4f4 32%,
                #8c8c8c 48%,
                #e8e8e8 60%,
                #b0b0b0 75%,
                #f8f8f8 88%,
                #cfcfcf 100%);
            color: black;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            text-align: center;
        }

        .box {
            width: 100%;
            max-width: 400px;
            padding: 30px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 30px;
        }

        #namensfeld {
            width: 90%;
            max-width: 300px;
            height: 60px;
            font-size: 24px;
            text-align: center;

            display: block;
            margin: 0 auto;

            border: 1px solid #ccc;
            border-radius: 10px;
        }

        #sendenButton {
            margin-top: 20px;
            padding: 15px 30px;

            font-size: 18px;

            border: none;
            border-radius: 10px;

            cursor: pointer;
        }

        #meldung {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>DEIN NAME</h1>

        <input id="namensfeld" type="text" autocomplete="off">

        <button id="sendenButton">Namen hinzufuegen</button>

        <div id="meldung"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        var SUPABASE_URL = "https://kqcmvyanjddcmeooqxaz.supabase.co";
        var SUPABASE_KEY = "sb_publishable_PJWkENh6UaNXozYPPgHauA_86KQNb1z";

        var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        var feld = document.getElementById("namensfeld");
        var button = document.getElementById("sendenButton");
        var meldung = document.getElementById("meldung");

        button.addEventListener("click", function () {

            var name = feld.value.trim();

            if (name === "") {
                meldung.textContent = "Bitte gib deinen Namen ein.";
                return;
            }

            var anfangsBuchstabe = name.charAt(0).toUpperCase();

            meldung.textContent = "Wird gespeichert...";

            supabaseClient
                .from("Buchstaben")
                .insert({
                    Name: name,
                    Buchstabe: anfangsBuchstabe
                })
                .then(function (response) {

                    if (response.error) {
                        console.error("SUPABASE FEHLER:", response.error);
                        meldung.textContent = "Fehler beim Speichern.";
                        return;
                    }

                    meldung.textContent = "Dein Name wurde hinzugefuegt!";
                    feld.value = "";
                    feld.focus();

                });

        });

    </script>

</body>
</html>
